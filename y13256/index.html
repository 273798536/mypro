<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校接送容量复核</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>学校接送容量复核</h1>
            <div class="header-actions">
                <button id="btn-import" class="btn btn-primary">导入材料</button>
                <button id="btn-export-screenshot" class="btn btn-secondary">导出截图说明</button>
            </div>
        </header>

        <div class="status-tabs">
            <button class="tab-btn active" data-tab="all">全部</button>
            <button class="tab-btn" data-tab="pending">待补材料 <span class="badge badge-warning" id="count-pending">0</span></button>
            <button class="tab-btn" data-tab="manual">人工改判 <span class="badge badge-info" id="count-manual">0</span></button>
            <button class="tab-btn" data-tab="done">已处理 <span class="badge badge-success" id="count-done">0</span></button>
        </div>

        <main class="app-main">
            <section class="import-panel" id="import-panel">
                <div class="panel-header">
                    <h2>材料导入</h2>
                    <button class="btn-close" id="btn-close-import">&times;</button>
                </div>
                <div class="panel-body">
                    <div class="import-section">
                        <h3>审批台账（Excel/CSV）</h3>
                        <div class="drop-zone" id="drop-ledger">
                            <input type="file" id="file-ledger" accept=".csv,.xlsx,.xls" hidden>
                            <p>点击或拖拽文件到此处上传审批台账</p>
                            <p class="file-name" id="file-ledger-name"></p>
                        </div>
                    </div>
                    <div class="import-section">
                        <h3>正常记录</h3>
                        <div class="drop-zone" id="drop-normal">
                            <input type="file" id="file-normal" accept=".csv,.xlsx,.xls,.txt" hidden>
                            <p>点击或拖拽文件到此处上传正常记录</p>
                            <p class="file-name" id="file-normal-name"></p>
                        </div>
                    </div>
                    <div class="import-section">
                        <h3>临时口头说明</h3>
                        <textarea id="verbal-note" rows="4" placeholder="请输入临时口头说明内容..."></textarea>
                    </div>
                    <div class="import-actions">
                        <button class="btn btn-primary" id="btn-do-import">开始复核</button>
                    </div>
                </div>
            </section>

            <section class="record-list" id="record-list">
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon">📋</div>
                    <h3>暂无复核记录</h3>
                    <p>点击"导入材料"开始上传审批台账、正常记录和口头说明</p>
                </div>
            </section>

            <section class="record-detail" id="record-detail">
                <div class="panel-header">
                    <h2 id="detail-title">记录详情</h2>
                    <button class="btn-close" id="btn-close-detail">&times;</button>
                </div>
                <div class="panel-body" id="detail-content">
                </div>
            </section>

            <section class="screenshot-panel" id="screenshot-panel">
                <div class="panel-header">
                    <h2>截图说明</h2>
                    <button class="btn-close" id="btn-close-screenshot">&times;</button>
                </div>
                <div class="panel-body" id="screenshot-content">
                </div>
                <div class="panel-footer">
                    <button class="btn btn-secondary" id="btn-copy-screenshot">复制说明文本</button>
                    <button class="btn btn-primary" id="btn-download-screenshot">下载截图</button>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/import.js"></script>
    <script src="js/verify.js"></script>
    <script src="js/operations.js"></script>
    <script src="js/photo.js"></script>
    <script src="js/screenshot.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
