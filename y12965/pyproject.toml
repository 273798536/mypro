[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-injection-regression"
version = "0.1.0"
description = "SQL注入规则回归分析工具 - SRE值班专用"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "sqlparse>=0.4.4",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
sql-regression = "sql_injection_regression.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sql_injection_regression*"]
