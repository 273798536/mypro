    <script>
    // ==================== 数据模型 ====================
    const DataModel = {
        timeWindows: [
            { id: 'tw1', name: '618预热期', startDate: '2026-05-20', endDate: '2026-05-31', color: 0x3b82f6, z: -30 },
            { id: 'tw2', name: '618爆发期', startDate: '2026-06-01', endDate: '2026-06-18', color: 0x8b5cf6, z: 0 },
            { id: 'tw3', name: '618返场期', startDate: '2026-06-19', endDate: '2026-06-30', color: 0x06b6d4, z: 30 }
        ],
        
        topics: [
            { id: 't1', name: '夏日穿搭', color: 0xa855f7 },
            { id: 't2', name: '新品开箱', color: 0xa855f7 },
            { id: 't3', name: '好物分享', color: 0xa855f7 },
            { id: 't4', name: '护肤心得', color: 0xa855f7 },
            { id: 't5', name: '彩妆教程', color: 0xa855f7 }
        ],

        influencers: [
            { id: 'i1', name: '小美酱', platform: '抖音', followers: 1250000, engagement: 8.5, truePlatform: '抖音', timeWindow: 'tw1', issues: [] },
            { id: 'i2', name: '小美酱', platform: '小红书', followers: 890000, engagement: 12.3, truePlatform: '小红书', timeWindow: 'tw1', issues: ['duplicate_name'] },
            { id: 'i3', name: '穿搭达人Lily', platform: '小红书', followers: 2100000, engagement: 6.8, truePlatform: '小红书', timeWindow: 'tw1', issues: [] },
            { id: 'i4', name: '科技宅男', platform: 'B站', followers: 3200000, engagement: 15.2, truePlatform: 'B站', timeWindow: 'tw1', issues: [] },
            { id: 'i5', name: '护肤专家Amy', platform: '微博', followers: 5600000, engagement: 4.2, truePlatform: '微博', timeWindow: 'tw2', issues: [] },
            { id: 'i6', name: '彩妆师Kevin', platform: '抖音', followers: 4500000, engagement: 9.1, truePlatform: '抖音', timeWindow: 'tw2', issues: [] },
            { id: 'i7', name: '健身教练小王', platform: 'B站', followers: 1800000, engagement: 11.5, truePlatform: 'B站', timeWindow: 'tw2', issues: ['wrong_topic'] },
            { id: 'i8', name: '美食博主老李', platform: '抖音', followers: 2800000, engagement: 7.8, truePlatform: '抖音', timeWindow: 'tw2', issues: [] },
            { id: 'i9', name: '旅行家张小姐', platform: '小红书', followers: 1950000, engagement: 10.2, truePlatform: '小红书', timeWindow: 'tw3', issues: ['missing_exposure'] },
            { id: 'i10', name: '数码测评君', platform: 'B站', followers: 4100000, engagement: 13.7, truePlatform: 'B站', timeWindow: 'tw3', issues: [] },
            { id: 'i11', name: '宝妈日常', platform: '微博', followers: 1500000, engagement: 5.5, truePlatform: '微博', timeWindow: 'tw3', issues: [] },
            { id: 'i12', name: '潮牌主理人', platform: '抖音', followers: 3800000, engagement: 8.9, truePlatform: '抖音', timeWindow: 'tw3', issues: [] }
        ],

        edges: [
            { id: 'e1', from: 'i1', to: 't1', weight: 0.85, timeWindow: 'tw1', exposure: 4500000, issues: [] },
            { id: 'e2', from: 'i2', to: 't1', weight: 0.72, timeWindow: 'tw1', exposure: 3200000, issues: ['duplicate_name'] },
            { id: 'e3', from: 'i3', to: 't3', weight: 0.91, timeWindow: 'tw1', exposure: 6800000, issues: [] },
            { id: 'e4', from: 'i4', to: 't2', weight: 0.78, timeWindow: 'tw1', exposure: 5100000, issues: [] },
            { id: 'e5', from: 'i5', to: 't4', weight: 0.88, timeWindow: 'tw2', exposure: 8200000, issues: [] },
            { id: 'e6', from: 'i6', to: 't5', weight: 0.94, timeWindow: 'tw2', exposure: 9500000, issues: [] },
            { id: 'e7', from: 'i7', to: 't5', weight: 0.45, timeWindow: 'tw2', exposure: 2100000, issues: ['wrong_topic'] },
            { id: 'e8', from: 'i8', to: 't3', weight: 0.82, timeWindow: 'tw2', exposure: 7200000, issues: [] },
            { id: 'e9', from: 'i9', to: 't3', weight: 0.76, timeWindow: 'tw3', exposure: 0, issues: ['missing_exposure'] },
            { id: 'e10', from: 'i10', to: 't2', weight: 0.92, timeWindow: 'tw3', exposure: 8800000, issues: [] },
            { id: 'e11', from: 'i11', to: 't4', weight: 0.68, timeWindow: 'tw3', exposure: 4100000, issues: [] },
            { id: 'e12', from: 'i12', to: 't1', weight: 0.87, timeWindow: 'tw3', exposure: 7600000, issues: [] },
            { id: 'e13', from: 'i1', to: 'i3', weight: 0.55, timeWindow: 'tw1', exposure: 1800000, issues: [], isCooperation: true },
            { id: 'e14', from: 'i5', to: 'i6', weight: 0.62, timeWindow: 'tw2', exposure: 2500000, issues: [], isCooperation: true },
            { id: 'e15', from: 'i9', to: 'i12', weight: 0.48, timeWindow: 'tw3', exposure: 1500000, issues: [], isCooperation: true }
        ],

        exposureRecords: [
            { id: 'er1', influencerId: 'i9', timeWindowId: 'tw3', views: 0, isSupplementary: false, shouldBe: 5800000 }
        ],

        issues: [
            { id: 'issue1', type: 'duplicate_name', severity: 'high', title: '达人重名', description: '发现2个名为"小美酱"的达人，分属不同平台', relatedNodes: ['i1', 'i2'], relatedEdges: ['e1', 'e2'] },
            { id: 'issue2', type: 'wrong_topic', severity: 'medium', title: '话题错连', description: '健身教练小王与"彩妆教程"话题关联度异常低(0.45)', relatedNodes: ['i7'], relatedEdges: ['e7'] },
            { id: 'issue3', type: 'missing_exposure', severity: 'high', title: '曝光补录', description: '旅行家张小姐在返场期曝光数据缺失', relatedNodes: ['i9'], relatedEdges: ['e9'] },
            { id: 'issue4', type: 'data_consistency', severity: 'low', title: '数据一致性校验', description: '同一批节点二次运行结果对比中', relatedNodes: [], relatedEdges: [] },
            { id: 'issue5', type: 'platform_mismatch', severity: 'medium', title: '平台标签待确认', description: '系统检测到跨平台重名，建议人工核验', relatedNodes: ['i1', 'i2'], relatedEdges: [] }
        ]
    };

    // 深拷贝用于对比
    let originalData = JSON.parse(JSON.stringify(DataModel));
    let currentData = JSON.parse(JSON.stringify(DataModel));
    let selectedObject = null;
    let highlightedObjects = [];

    // ==================== Three.js 场景初始化 ====================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.Fog(0x0f172a, 50, 200);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(40, 50, 80);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 光照
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
    mainLight.position.set(50, 100, 50);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x6366f1, 0.3);
    fillLight.position.set(-50, 50, -50);
    scene.add(fillLight);

    // 轨道控制
    let isMouseDown = false;
    let mouseDownX = 0, mouseDownY = 0;
    let cameraTheta = Math.PI / 4;
    let cameraPhi = Math.PI / 3;
    let cameraRadius = 100;
    let cameraTarget = new THREE.Vector3(0, 0, 0);

    function updateCameraPosition() {
        camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.lookAt(cameraTarget);
    }

    updateCameraPosition();

    // 鼠标控制
    renderer.domElement.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        mouseDownX = e.clientX;
        mouseDownY = e.clientY;
    });

    renderer.domElement.addEventListener('mouseup', () => {
        isMouseDown = false;
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const deltaX = e.clientX - mouseDownX;
        const deltaY = e.clientY - mouseDownY;
        
        if (e.button === 0) {
            cameraTheta -= deltaX * 0.005;
            cameraPhi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraPhi + deltaY * 0.005));
        } else if (e.button === 2) {
            const right = new THREE.Vector3();
            const up = new THREE.Vector3(0, 1, 0);
            camera.getWorldDirection(right);
            right.cross(up).normalize();
            cameraTarget.addScaledVector(right, -deltaX * 0.1);
            cameraTarget.y += deltaY * 0.1;
        }
        
        updateCameraPosition();
        mouseDownX = e.clientX;
        mouseDownY = e.clientY;
    });

    renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        cameraRadius = Math.max(30, Math.min(200, cameraRadius + e.deltaY * 0.1));
        updateCameraPosition();
    });

    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // ==================== 3D对象创建 ====================
    const nodeMeshes = [];
    const edgeMeshes = [];
    const windowMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const platformColors = {
        '抖音': 0x22d3ee,
        '小红书': 0xf87171,
        '微博': 0xfacc15,
        'B站': 0xf472b6
    };

    function createTimeWindowPlane(windowData) {
        const geometry = new THREE.PlaneGeometry(80, 60, 1, 1);
        const material = new THREE.MeshBasicMaterial({
            color: windowData.color,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(geometry, material);
        plane.rotation.x = -Math.PI / 2;
        plane.position.set(0, -5, windowData.z);
        plane.userData = { type: 'timeWindow', data: windowData };
        
        const edgeGeometry = new THREE.EdgesGeometry(geometry);
        const edgeMaterial = new THREE.LineBasicMaterial({ color: windowData.color, transparent: true, opacity: 0.5 });
        const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
        edges.rotation.x = -Math.PI / 2;
        edges.position.copy(plane.position);
        
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 256;
        labelCanvas.height = 64;
        const ctx = labelCanvas.getContext('2d');
        ctx.fillStyle = '#' + windowData.color.toString(16).padStart(6, '0');
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(windowData.name, 128, 40);
        
        const labelTexture = new THREE.CanvasTexture(labelCanvas);
        const labelMaterial = new THREE.SpriteMaterial({ map: labelTexture, transparent: true });
        const label = new THREE.Sprite(labelMaterial);
        label.position.set(0, 5, windowData.z - 30);
        label.scale.set(20, 5, 1);
        
        return { plane, edges, label, data: windowData };
    }

    function createInfluencerNode(influencer, index, total) {
        const tw = currentData.timeWindows.find(t => t.id === influencer.timeWindow);
        const angle = (index / total) * Math.PI * 2;
        const radius = 15 + Math.random() * 10;
        const x = Math.cos(angle) * radius;
        const z = tw.z + Math.sin(angle) * 10;
        const y = influencer.engagement * 0.5 + Math.random() * 2;
        
        const size = Math.sqrt(influencer.followers) / 300;
        const geometry = new THREE.IcosahedronGeometry(size, 1);
        const material = new THREE.MeshPhongMaterial({
            color: platformColors[influencer.platform] || 0x888888,
            emissive: platformColors[influencer.platform] || 0x888888,
            emissiveIntensity: 0.2,
            shininess: 100
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.userData = { type: 'influencer', data: influencer, originalPosition: mesh.position.clone() };
        
        if (influencer.issues.length > 0) {
            const ringGeometry = new THREE.TorusGeometry(size * 1.5, 0.1, 8, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xef4444,
                transparent: true,
                opacity: 0.8
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            mesh.add(ring);
            mesh.userData.issueRing = ring;
        }
        
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 256;
        labelCanvas.height = 64;
        const ctx = labelCanvas.getContext('2d');
        ctx.clearRect(0, 0, 256, 64);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(influencer.name, 128, 30);
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(influencer.platform, 128, 52);
        
        const labelTexture = new THREE.CanvasTexture(labelCanvas);
        const labelMaterial = new THREE.SpriteMaterial({ map: labelTexture, transparent: true });
        const label = new THREE.Sprite(labelMaterial);
        label.position.set(0, size + 1.5, 0);
        label.scale.set(6, 1.5, 1);
        mesh.add(label);
        
        return mesh;
    }

    function createTopicNode(topic, timeWindow, index, total) {
        const tw = currentData.timeWindows.find(t => t.id === timeWindow);
        const angle = (index / total) * Math.PI * 2 + Math.PI / total;
        const x = Math.cos(angle) * 30;
        const z = tw.z + Math.sin(angle) * 20;
        const y = 8 + Math.random() * 4;
        
        const geometry = new THREE.OctahedronGeometry(1.5, 0);
        const material = new THREE.MeshPhongMaterial({
            color: topic.color,
            emissive: topic.color,
            emissiveIntensity: 0.3,
            transparent: true,
            opacity: 0.9
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.userData = { type: 'topic', data: topic, timeWindow };
        
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 256;
        labelCanvas.height = 64;
        const ctx = labelCanvas.getContext('2d');
        ctx.fillStyle = '#a855f7';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('#' + topic.name, 128, 40);
        
        const labelTexture = new THREE.CanvasTexture(labelCanvas);
        const labelMaterial = new THREE.SpriteMaterial({ map: labelTexture, transparent: true });
        const label = new THREE.Sprite(labelMaterial);
        label.position.set(0, 2.5, 0);
        label.scale.set(8, 2, 1);
        mesh.add(label);
        
        return mesh;
    }

    function createEdge(edgeData, fromPos, toPos) {
        const points = [];
        const midY = Math.max(fromPos.y, toPos.y) + 3;
        const midPoint = new THREE.Vector3(
            (fromPos.x + toPos.x) / 2,
            midY,
            (fromPos.z + toPos.z) / 2
        );
        
        for (let i = 0; i <= 20; i++) {
            const t = i / 20;
            const x = THREE.MathUtils.lerp(fromPos.x, toPos.x, t);
            const z = THREE.MathUtils.lerp(fromPos.z, toPos.z, t);
            const y = t < 0.5 
                ? THREE.MathUtils.lerp(fromPos.y, midY, t * 2)
                : THREE.MathUtils.lerp(midY, toPos.y, (t - 0.5) * 2);
            points.push(new THREE.Vector3(x, y, z));
        }
        
        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeometry = new THREE.TubeGeometry(curve, 20, 0.08 + edgeData.weight * 0.15, 8, false);
        const color = edgeData.weight > 0.7 ? 0x22c55e : 0xf97316;
        const material = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: edgeData.isCooperation ? 0.6 : edgeData.weight * 0.8
        });
        const mesh = new THREE.Mesh(tubeGeometry, material);
        mesh.userData = { type: 'edge', data: edgeData, fromPos, toPos, curve };
        
        return mesh;
    }

    // ==================== 场景构建 ====================
    let influencerMeshes = [];
    let topicMeshes = [];
    let allMeshes = [];

    function buildScene() {
        nodeMeshes.forEach(m => scene.remove(m));
        edgeMeshes.forEach(m => scene.remove(m));
        windowMeshes.forEach(m => { scene.remove(m.plane); scene.remove(m.edges); scene.remove(m.label); });
        nodeMeshes.length = 0;
        edgeMeshes.length = 0;
        windowMeshes.length = 0;
        influencerMeshes = [];
        topicMeshes = [];
        allMeshes = [];

        const twFilter = document.getElementById('timeWindowFilter').value;
        const pfFilter = document.getElementById('platformFilter').value;
        const runMode = document.getElementById('runSelector').value;

        const dataSource = runMode === 'run2' ? currentData : originalData;

        const visibleWindows = twFilter === 'all' 
            ? dataSource.timeWindows 
            : dataSource.timeWindows.filter(tw => tw.id === twFilter);

        visibleWindows.forEach(tw => {
            const windowObj = createTimeWindowPlane(tw);
            scene.add(windowObj.plane);
            scene.add(windowObj.edges);
            scene.add(windowObj.label);
            windowMeshes.push(windowObj);
        });

        const visibleInfluencers = dataSource.influencers.filter(i => {
            const twMatch = twFilter === 'all' || i.timeWindow === twFilter;
            const pfMatch = pfFilter === 'all' || i.platform === pfFilter;
            return twMatch && pfMatch;
        });

        const visibleTopics = dataSource.topics.filter(t => {
            return dataSource.edges.some(e => 
                e.to === t.id && 
                (twFilter === 'all' || e.timeWindow === twFilter)
            );
        });

        visibleWindows.forEach(tw => {
            const twTopics = visibleTopics.filter(t => 
                dataSource.edges.some(e => e.to === t.id && e.timeWindow === tw.id)
            );
            twTopics.forEach((topic, idx) => {
                const mesh = createTopicNode(topic, tw.id, idx, twTopics.length);
                scene.add(mesh);
                nodeMeshes.push(mesh);
                topicMeshes.push(mesh);
                allMeshes.push(mesh);
            });
        });

        visibleInfluencers.forEach((inf, idx) => {
            const mesh = createInfluencerNode(inf, idx, visibleInfluencers.length);
            scene.add(mesh);
            nodeMeshes.push(mesh);
            influencerMeshes.push(mesh);
            allMeshes.push(mesh);
        });

        const nodeMap = {};
        nodeMeshes.forEach(m => {
            if (m.userData.type === 'influencer') nodeMap[m.userData.data.id] = m.position;
            if (m.userData.type === 'topic') nodeMap[m.userData.data.id] = m.position;
        });

        const visibleEdges = dataSource.edges.filter(e => {
            const twMatch = twFilter === 'all' || e.timeWindow === twFilter;
            const fromMatch = nodeMap[e.from];
            const toMatch = nodeMap[e.to];
            return twMatch && fromMatch && toMatch;
        });

        visibleEdges.forEach(edge => {
            const mesh = createEdge(edge, nodeMap[edge.from], nodeMap[edge.to]);
            scene.add(mesh);
            edgeMeshes.push(mesh);
            allMeshes.push(mesh);
        });

        updateStats();
        updateIssueList();
        populateTopicSelect();
    }

    function onClick(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(allMeshes, true);
        
        if (intersects.length > 0) {
            let obj = intersects[0].object;
            while (obj.parent && !obj.userData.type) {
                obj = obj.parent;
            }
            if (obj.userData.type) {
                selectObject(obj);
            }
        }
    }

            'missing_exposure': '曝光数据缺失，需补录',
            'platform_mismatch': '平台标签待确认'
        };
        return texts[type] || type;
    }

    // ==================== 问题定位与高亮 ====================
    function locateIssue(issueId) {
        const issue = currentData.issues.find(i => i.id === issueId);
        if (!issue) return;
        
        clearHighlight();
        
        issue.relatedNodes.forEach(nodeId => {
            const mesh = nodeMeshes.find(m => m.userData.data?.id === nodeId);
            if (mesh) {
                mesh.scale.multiplyScalar(1.5);
                highlightedObjects.push({ obj: mesh, scale: 1.5 });
                
                const targetPos = mesh.position.clone();
                cameraTarget.copy(targetPos);
                cameraRadius = 40;
                updateCameraPosition();
            }
        });
        
        issue.relatedEdges.forEach(edgeId => {
            const mesh = edgeMeshes.find(m => m.userData.data?.id === edgeId);
            if (mesh) {
                mesh.material.color.setHex(0xfbbf24);
                mesh.material.opacity = 1;
                highlightedObjects.push({ obj: mesh, scale: 1, isEdge: true });
            }
        });
        
        const panel = document.getElementById('detailPanel');
        if (issue.relatedNodes.length > 0) {
            const nodeMesh = nodeMeshes.find(m => m.userData.data?.id === issue.relatedNodes[0]);
            if (nodeMesh) showDetailPanel(nodeMesh);
        }
    }

                    <button class="text-cyan-400 hover:text-cyan-300 text-xs locate-btn" data-issue="${issue.id}">
                        定位 →
                    </button>
                </div>
                <p class="text-xs text-slate-400 mt-1 ml-4">${issue.description}</p>
            </div>
        `).join('');
        
        container.querySelectorAll('.locate-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                locateIssue(btn.dataset.issue);
            });
        });
        
        container.querySelectorAll('.issue-item').forEach(item => {
            item.addEventListener('click', () => locateIssue(item.dataset.issue));
        });
    }

    function populateTopicSelect() {
        const select = document.getElementById('correctTopic');
        select.innerHTML = '<option value="">选择话题...</option>' + 
            currentData.topics.map(t => `<option value="${t.id}">#${t.name}</option>`).join('');
    }

    function populateTimeWindowFilter() {
        const select = document.getElementById('timeWindowFilter');
        select.innerHTML = '<option value="all">全部时间窗口</option>' +
            currentData.timeWindows.map(tw => `<option value="${tw.id}">${tw.name}</option>`).join('');
    }

    // ==================== 手动修正功能 ====================
    function applyCorrection() {
        if (!selectedObject || selectedObject.userData.type !== 'influencer') {
            alert('请先在3D视图中选择一个达人节点');
            return;
        }
        
        const influencer = selectedObject.userData.data;
        const newPlatform = document.getElementById('correctPlatform').value;
        const newTopic = document.getElementById('correctTopic').value;
        const supplement = parseInt(document.getElementById('supplementExposure').value) || 0;
        
        const corrections = [];
        
        if (newPlatform && newPlatform !== influencer.platform) {
            corrections.push(`平台标签: ${influencer.platform} → ${newPlatform}`);
            influencer.platform = newPlatform;
            const idx = influencer.issues.indexOf('platform_mismatch');
            if (idx > -1) influencer.issues.splice(idx, 1);
            if (influencer.issues.length === 0 && selectedObject.userData.issueRing) {
                selectedObject.remove(selectedObject.userData.issueRing);
            }
        }
        
        if (newTopic) {
            const existingEdge = currentData.edges.find(e => e.from === influencer.id && e.to === newTopic);
            if (!existingEdge) {
                const topic = currentData.topics.find(t => t.id === newTopic);
                corrections.push(`新增话题关联: #${topic.name}`);
                currentData.edges.push({
                    id: 'e' + Date.now(),
                    from: influencer.id,
                    to: newTopic,
                    weight: 0.8,
                    timeWindow: influencer.timeWindow,
                    exposure: supplement || 1000000,
                    issues: []
                });
            }
        }
        
        if (supplement > 0) {
            const expEdge = currentData.edges.find(e => e.from === influencer.id && e.issues.includes('missing_exposure'));
            if (expEdge) {
                corrections.push(`补录曝光: ${supplement.toLocaleString()}`);
                expEdge.exposure = supplement;
                const idx = expEdge.issues.indexOf('missing_exposure');
                if (idx > -1) expEdge.issues.splice(idx, 1);
                const expIdx = influencer.issues.indexOf('missing_exposure');
                if (expIdx > -1) influencer.issues.splice(expIdx, 1);
            }
        }
        
        if (corrections.length > 0) {
            const log = document.getElementById('correctionLog');
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML = `<div class="text-green-400">[${timestamp}] ${influencer.name}: ${corrections.join(' | ')}</div>` + log.innerHTML;
            
            buildScene();
            showDetailPanel(selectedObject);
        }
        
        document.getElementById('correctPlatform').value = '';
        document.getElementById('correctTopic').value = '';
        document.getElementById('supplementExposure').value = '';
    }

    function showComparison() {
        const modal = document.getElementById('compareModal');
        const oldContainer = document.getElementById('oldResult');
        const newContainer = document.getElementById('newResult');
        
        modal.classList.remove('hidden');
        
        const oldInfluencers = originalData.influencers.slice(0, 6);
        const newInfluencers = currentData.influencers.slice(0, 6);
        
        oldContainer.innerHTML = oldInfluencers.map(inf => `
            <div class="bg-slate-700/50 rounded-lg p-3">
                <div class="flex items-center justify-between">
                    <span class="font-medium">${inf.name}</span>
                    <span class="text-xs px-2 py-0.5 rounded" style="background: ${'#' + platformColors[inf.platform].toString(16).padStart(6, '0')}30; color: ${'#' + platformColors[inf.platform].toString(16).padStart(6, '0')}">
                        ${inf.platform}
                    </span>
                </div>
                <div class="text-xs text-slate-400 mt-1">
                    粉丝: ${(inf.followers / 10000).toFixed(0)}万 | 互动: ${inf.engagement}%
                </div>
                ${inf.issues.length > 0 ? `<div class="text-xs text-red-400 mt-1">⚠️ ${inf.issues.map(i => getIssueText(i)).join(', ')}</div>` : ''}
            </div>
        `).join('');
        
        newContainer.innerHTML = newInfluencers.map(inf => `
            <div class="bg-slate-700/50 rounded-lg p-3 ${originalData.influencers.find(o => o.id === inf.id)?.platform !== inf.platform ? 'ring-2 ring-green-500' : ''}">
                <div class="flex items-center justify-between">
                    <span class="font-medium">${inf.name}</span>
                    <span class="text-xs px-2 py-0.5 rounded" style="background: ${'#' + platformColors[inf.platform].toString(16).padStart(6, '0')}30; color: ${'#' + platformColors[inf.platform].toString(16).padStart(6, '0')}">
                        ${inf.platform}
                    </span>
                </div>
                <div class="text-xs text-slate-400 mt-1">
                    粉丝: ${(inf.followers / 10000).toFixed(0)}万 | 互动: ${inf.engagement}%
                </div>
                ${inf.issues.length > 0 ? `<div class="text-xs text-red-400 mt-1">⚠️ ${inf.issues.map(i => getIssueText(i)).join(', ')}</div>` : ''}
            </div>
        `).join('');
        
        const oldIssues = originalData.issues.length;
        const newIssues = currentData.issues.length;
        const diff = oldIssues - newIssues;
        
        oldContainer.innerHTML = `
            <div class="bg-red-500/10 border border-red-500/30 rounded-lg p-3 mb-3">
                <div class="text-red-400 font-semibold">问题总数: ${oldIssues}</div>
            </div>
        ` + oldContainer.innerHTML;
        
        newContainer.innerHTML = `
            <div class="bg-green-500/10 border border-green-500/30 rounded-lg p-3 mb-3">
                <div class="text-green-400 font-semibold">问题总数: ${newIssues} ${diff > 0 ? `<span class="text-xs">(${diff}个已修复)</span>` : ''}</div>
            </div>
        ` + newContainer.innerHTML;
    }

    // ==================== 动画与渲染 ====================
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        
        nodeMeshes.forEach((mesh, idx) => {
            if (mesh.userData.type === 'influencer') {
                mesh.rotation.y += 0.005;
                mesh.position.y = mesh.userData.originalPosition.y + Math.sin(time + idx * 0.5) * 0.3;
            } else if (mesh.userData.type === 'topic') {
                mesh.rotation.y += 0.01;
                mesh.rotation.x = Math.sin(time * 0.5 + idx) * 0.2;
            }
            if (mesh.userData.issueRing) {
                mesh.userData.issueRing.rotation.z += 0.02;
            }
        });
        
        renderer.render(scene, camera);
    }

    // ==================== 事件绑定 ====================
    document.getElementById('closeDetail').addEventListener('click', () => {
        document.getElementById('detailPanel').classList.add('hidden');
        clearHighlight();
        document.getElementById('currentSelection').textContent = '无';
    });

    document.getElementById('resetViewBtn').addEventListener('click', () => {
        cameraTheta = Math.PI / 4;
        cameraPhi = Math.PI / 3;
        cameraRadius = 100;
        cameraTarget.set(0, 0, 0);
        updateCameraPosition();
    });

    document.getElementById('screenshotBtn').addEventListener('click', () => {
        renderer.render(scene, camera);
        const dataURL = renderer.domElement.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `传播网络_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = dataURL;
        link.click();
    });

    document.getElementById('timeWindowFilter').addEventListener('change', buildScene);
    document.getElementById('platformFilter').addEventListener('change', buildScene);
    document.getElementById('runSelector').addEventListener('change', buildScene);

    document.getElementById('applyCorrection').addEventListener('click', applyCorrection);
    document.getElementById('compareBtn').addEventListener('click', showComparison);
    
    document.getElementById('closeCompare').addEventListener('click', () => {
        document.getElementById('compareModal').classList.add('hidden');
    });
    
    document.getElementById('confirmCompare').addEventListener('click', () => {
        originalData = JSON.parse(JSON.stringify(currentData));
        buildScene();
        document.getElementById('compareModal').classList.add('hidden');
        alert('已保存修正结果，originalData已更新为当前版本');
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================== 初始化 ====================
    populateTimeWindowFilter();
    buildScene();
    animate();

    console.log('品牌社媒传播网络分析系统已启动');
    console.log('数据一致性校验: 同一批节点已载入两次，可通过顶部"运行选择器"切换对比');
    </script>
</body>
</html>
