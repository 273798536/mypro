[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collision-checker"
version = "0.1.0"
description = "几何碰撞批量检测CLI工具"
authors = [{name = "Game Art Team"}]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "shapely>=2.0",
    "svgwrite>=1.4",
]

[project.scripts]
collision-checker = "collision_checker.cli:main"
