[tool.poetry]
name = "qc-traceability"
version = "0.1.0"
description = "小厂质检返工权限追责台账服务"
authors = ["QC Team"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-multipart = "^0.0.6"
pandas = "^2.0.0"
openpyxl = "^3.1.0"
click = "^8.1.0"
python-jose = "^3.3.0"
passlib = "^1.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
