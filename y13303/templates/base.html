<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}客服摘要误判回放系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .navbar-brand {
            font-weight: 600;
        }
        .badge-duplicate {
            background-color: #6f42c1;
        }
        .badge-dirty {
            background-color: #fd7e14;
        }
        .badge-corrected {
            background-color: #0d6efd;
        }
        .evidence-link {
            color: #0d6efd;
            text-decoration: underline;
            cursor: pointer;
            text-decoration-style: dotted;
        }
        .trace-highlight {
            background-color: #fff3cd;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .snapshot-box {
            background-color: #e9ecef;
            border-left: 4px solid #6c757d;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }
        .verbal-quote {
            border-left: 4px solid #198754;
            padding: 8px 12px;
            background-color: #f0f9f0;
            font-style: italic;
            color: #198754;
        }
        .pull-card {
            border-left: 4px solid #dc3545;
        }
        .consistency-good {
            border-left: 4px solid #198754;
        }
        .consistency-bad {
            border-left: 4px solid #dc3545;
        }
        .relation-ambiguous {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
        }
        .markdown-body h1 { font-size: 1.8em; border-bottom: 2px solid #dee2e6; padding-bottom: 8px; }
        .markdown-body h2 { font-size: 1.4em; border-bottom: 1px solid #dee2e6; padding-bottom: 6px; margin-top: 24px; }
        .markdown-body h3 { font-size: 1.2em; margin-top: 20px; }
        .markdown-body blockquote { border-left: 4px solid #dee2e6; padding-left: 12px; color: #6c757d; }
        .markdown-body code { background-color: #f8f9fa; padding: 2px 6px; border-radius: 3px; }
        .markdown-body pre { background-color: #f8f9fa; padding: 12px; border-radius: 6px; }
        .step-line {
            position: relative;
            padding-left: 40px;
        }
        .step-number {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #0d6efd;
            color: white;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
        }
        .tag-legend span {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            color: white;
            margin-right: 4px;
        }
        .status-completed { background-color: #198754; }
        .status-pending { background-color: #ffc107; color: #333; }
        .status-running { background-color: #0d6efd; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="bi bi-shield-check"></i> 客服摘要误判回放系统
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">
                            <i class="bi bi-list-check"></i> 回放任务
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link">
                            <i class="bi bi-person-circle"></i> 风控运营 - 老唐
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer class="mt-5 py-4 border-top bg-white">
        <div class="container text-center text-muted small">
            <p class="mb-1">客服摘要误判回放系统 &copy; 2024 | 风控运营专用</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
