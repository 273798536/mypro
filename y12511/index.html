var S={scen:'normal',hr:8,playing:false,pIv:null,selBus:null,tab:'load',expFmt:'summary'};

function fSrc(id){return D.sources.find(function(x){return x.id===id})}
function fSS(id){return D.substations.find(function(x){return x.id===id})}
function gSC(){return SC[S.scen]}
function swSt(sw){var o=gSC().swOvr[sw.id];return o!==undefined?o:sw.pos}
function ldAt(id,hr){var c=D.curves[id];return c?Math.round(c[hr]*gSC().lm):0}
function flAt(lid,hr){var f=gSC().flows[lid];return f?f[hr]:0}
function lnSt(lid,hr){var f=flAt(lid,hr),l=D.lines.find(function(x){return x.id===lid});if(f===0)return'outage';var r=f/l.cap;if(r>=1)return'critical';if(r>=.9)return'overload';if(r>=.75)return'warning';return'normal'}
function bSt(id,hr){var ld=ldAt(id,hr),cp=D.loads[id].cap*gSC().lm,r=ld/cp;if(r>=1)return'critical';if(r>=.9)return'overload';if(r>=.75)return'warning';return'normal'}
function sCol(s){return{normal:'var(--gn)',warning:'var(--yw)',overload:'var(--or)',critical:'var(--rd)',maintenance:'var(--pp)',outage:'var(--gy)'}[s]||'var(--t3)'}
function sLbl(s){return{normal:'正常',warning:'警告',overload:'逼近限值',critical:'超限',maintenance:'检修中',outage:'停运'}[s]||s}
function vCol(v){return v>=220?'#ff6b6b':v>=110?'#ffd93d':'#6bcb77'}
function p2(n){return n<10?'0'+n:''+n}

function diagnose(hr){
var R=[],scenario=gSC();
D.switches.forEach(function(sw){
var act=swSt(sw),exp=sw.exp;
if(act!==exp){
var inSc=scenario.swOvr[sw.id]!==undefined;
var isMt=D.maint.some(function(m){return m.eq===sw.id||m.eq===sw.line});
var conc,det,fix;
if(inSc){conc='场景指定操作';det=sw.name+'在「'+scenario.name+'」中被指定为'+(act==='open'?'分闸':'合闸')+'，属场景预设，非误位。';fix=null}
else if(isMt){conc='检修配套操作';det=sw.name+'因关联检修计划而断开，属预期操作。';fix=null}
else{conc='⚠ 开关误位';det=sw.name+'实际状态为'+(act==='open'?'分闸':'合闸')+'，预期应为'+(exp==='open'?'分闸':'合闸')+'。偏差原因未在检修计划或场景配置中体现。';fix='立即核查SCADA采集信号是否正常；若确认误位，执行'+(exp==='closed'?'合闸':'分闸')+'操作并记录操作票。'}
R.push({id:'D'+(R.length+1),type:'misposition',sev:conc.indexOf('⚠')>=0?'critical':'info',eq:sw.name,conc:conc,det:det,fix:fix,src:sw.src})
}});
D.lines.forEach(function(ln){
var flow=flAt(ln.id,hr);if(flow===0)return;
var ratio=flow/ln.cap;
if(ratio>=.9){
var fS=fSS(ln.from),tS=fSS(ln.to),conc,fix;
if(ratio>=1){conc='🔴 负荷超限';fix='1. 立即削减'+tS.name+'非重要负荷'+Math.round(flow-ln.cap)+'MW；2. 投入'+fS.name+'备用出力；3. 转移部分负荷至联络线供电。'}
else{conc='🟠 负荷逼近限值';fix='1. 监视'+ln.name+'潮流变化；2. 预安排'+tS.name+'负荷转移方案；3. 确认备用出力可随时投入。'}
R.push({id:'D'+(R.length+1),type:'overlimit',sev:ratio>=1?'critical':'warning',eq:ln.name,conc:conc,det:ln.name+'当前潮流'+flow+'MW，线路容量'+ln.cap+'MW，负载率'+(ratio*100).toFixed(1)+'%。'+fS.name+'→'+tS.name+'。',fix:fix,src:ln.src})
}});
D.substations.forEach(function(s){
var ld=ldAt(s.id,hr),cp=D.loads[s.id].cap*scenario.lm,ratio=ld/cp;
if(ratio>=.95){
var conc,fix;
if(ratio>=1){conc='🔴 变电站超载';fix='1. 立即执行'+s.name+'限电序位表；2. 通知重要用户减负荷；3. 启动应急调度方案。'}
else{conc='🟠 变电站高负载';fix='1. 加强'+s.name+'设备巡视；2. 预安排负荷转移；3. 通知相关用户做好限电准备。'}
R.push({id:'D'+(R.length+1),type:'overlimit',sev:ratio>=1?'critical':'warning',eq:s.name,conc:conc,det:s.name+'当前负荷'+ld+'MW，额定容量'+Math.round(cp)+'MW，负载率'+(ratio*100).toFixed(1)+'%。',fix:fix,src:D.loads[s.id].src})
}});
D.maint.forEach(function(m){
var eq=D.lines.find(function(l){return l.id===m.eq})||D.switches.find(function(x){return x.id===m.eq});
if(!eq)return;
var inW=hr>=m.s&&hr<m.e;
var line=D.lines.find(function(l){return l.id===m.eq});
if(line&&inW){
var flow=flAt(m.eq,hr);
if(flow>0)R.push({id:'D'+(R.length+1),type:'conflict',sev:'critical',eq:eq.name||eq.id,conc:'🔴 检修与潮流冲突',det:m.name+'计划于'+p2(m.s)+':00-'+p2(m.e)+':00执行，但'+eq.name+'当前仍有'+flow+'MW潮流通过。检修前需先转移全部负荷。',fix:'1. 立即将'+eq.name+'负荷转移至联络线；2. 确认转移后潮流为零方可执行检修；3. 如无法转移，推迟检修至低负荷时段。',src:m.src});
var aff=[];
D.lines.forEach(function(l){if(l.id===m.eq)aff.push(fSS(l.to).name)});
if(aff.length>0)R.push({id:'D'+(R.length+1),type:'conflict',sev:'warning',eq:eq.name||eq.id,conc:'🟣 检修影响供电',det:m.name+'执行期间，'+aff.join('、')+'由单电源供电，N-1安全性降低。',fix:'1. 检修期间加强相关线路巡检；2. 预安排应急转供方案；3. 通知受影响用户做好备自投准备。',src:m.src})
}});
R.sort(function(a,b){var o={critical:0,warning:1,info:2};return(o[a.sev]||2)-(o[b.sev]||2)});
return R
}

window._htt=function(){document.getElementById('ttip').style.display='none'};
window._sb=function(id){S.selBus=S.selBus===id?null:id;renderDiagram();renderPanel()};

function chartSVG(sid){
var scenario=gSC(),hr=S.hr,curve=D.curves[sid],cap=D.loads[sid].cap*scenario.lm;
if(!curve)return'';
var scaled=curve.map(function(v){return Math.round(v*scenario.lm)});
var maxV=Math.max.apply(null,scaled.concat([cap]))*1.15;
var cW=308,cH=140,pad=30,pW=cW-pad-10,pH=cH-pad-10;
var h='<svg viewBox="0 0 '+cW+' '+cH+'">';
for(var i=0;i<=4;i++){var y=pad+pH-pH*i/4,v=Math.round(maxV*i/4);h+='<line x1="'+pad+'" y1="'+y+'" x2="'+(pad+pW)+'" y2="'+y+'" stroke="#2a3a5c" stroke-width="0.5"/>';h+='<text x="'+(pad-4)+'" y="'+(y+3)+'" fill="#5a6f94" font-size="8" text-anchor="end">'+v+'</text>'}
for(var i=0;i<24;i++){var x=pad+pW*i/23;if(i%3===0){h+='<line x1="'+x+'" y1="'+pad+'" x2="'+x+'" y2="'+(pad+pH)+'" stroke="#2a3a5c" stroke-width="0.5"/>';h+='<text x="'+x+'" y="'+(pad+pH+10)+'" fill="#5a6f94" font-size="7" text-anchor="middle">'+p2(i)+'</text>'}}
var capY=pad+pH-pH*(cap/maxV);
h+='<line x1="'+pad+'" y1="'+capY+'" x2="'+(pad+pW)+'" y2="'+capY+'" stroke="#ff3d57" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>';
h+='<text x="'+(pad+pW+3)+'" y="'+(capY+3)+'" fill="#ff3d57" font-size="7">限值</text>';
var pts='';for(var i=0;i<24;i++){var x=pad+pW*i/23,y=pad+pH-pH*(scaled[i]/maxV);pts+=(i===0?'':' ')+x+','+y}
h+='<polyline points="'+pts+'" fill="none" stroke="#00d4ff" stroke-width="1.5"/>';
var area='';for(var i=0;i<24;i++){var x=pad+pW*i/23,y=pad+pH-pH*(scaled[i]/maxV);area+=(i===0?'M':'L')+x+' '+y+' '}
area+='L'+(pad+pW)+' '+(pad+pH)+' L'+pad+' '+(pad+pH)+' Z';
h+='<path d="'+area+'" fill="rgba(0,212,255,0.1)"/>';
var cx=pad+pW*hr/23,cy=pad+pH-pH*(scaled[hr]/maxV);
h+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#00d4ff" stroke="#0a1628" stroke-width="1.5"/>';
h+='<line x1="'+cx+'" y1="'+pad+'" x2="'+cx+'" y2="'+(pad+pH)+'" stroke="#00d4ff" stroke-width="0.5" opacity="0.5" stroke-dasharray="3,3"/>';
h+='<text x="'+cx+'" y="'+(cy-8)+'" fill="#00d4ff" font-size="9" text-anchor="middle" font-weight="700">'+scaled[hr]+'MW</text>';
h+='</svg>';return h
}

function renderPanel(){
var c=document.getElementById('pCont'),hr=S.hr,scenario=gSC();
if(S.tab==='load'){
var sid=S.selBus||'SS1',s=fSS(sid),ld=ldAt(sid,hr),cp=D.loads[sid].cap*scenario.lm,st=bSt(sid,hr);
var curve=D.curves[sid],scaled=curve.map(function(v){return Math.round(v*scenario.lm)});
var sc2=st==='normal'?'cn':st==='critical'?'rd':st==='overload'?'yw':'cn';
var h='<div class="bsel">';
D.substations.forEach(function(s2){h+='<span class="bchip'+(sid===s2.id?' on':'')+'" onclick="window._sb(\''+s2.id+'\')">'+s2.name+'</span>'});
h+='</div>';
h+='<div class="sstats"><div class="scard"><div class="sl">当前负荷</div><div class="sv '+sc2+'">'+ld+'MW</div></div>';
h+='<div class="scard"><div class="sl">负载率</div><div class="sv '+sc2+'">'+(ld/cp*100).toFixed(1)+'%</div></div>';
h+='<div class="scard"><div class="sl">额定容量</div><div class="sv gn">'+Math.round(cp)+'MW</div></div>';
h+='<div class="scard"><div class="sl">最大负荷</div><div class="sv yw">'+Math.max.apply(null,scaled)+'MW</div></div></div>';
h+='<div class="lchart">'+chartSVG(sid)+'</div>';
h+='<div style="font-size:11px;color:var(--t2);margin-top:4px">各时刻负荷（MW）：</div>';
h+='<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:4px">';
scaled.forEach(function(v,i){
var bg=v>=cp?'rgba(255,61,87,0.15)':v>=cp*.9?'rgba(255,143,0,0.1)':'rgba(0,212,255,0.05)';
var col=v>=cp?'var(--rd)':v>=cp*.9?'var(--or)':'var(--t2)';
h+='<div style="background:'+bg+';padding:2px 4px;border-radius:3px;font-size:10px;text-align:center;color:'+col+'">'+p2(i)+' '+v+'</div>';
});
h+='</div>';
h+='<div style="margin-top:8px;font-size:10px;color:var(--t3)">来源: '+fSrc(D.loads[sid].src).name+' | '+fSrc(D.loads[sid].src).time+'</div>';
c.innerHTML=h;
}else if(S.tab==='alerts'){
var diag=diagnose(hr);
if(diag.length===0){c.innerHTML='<div style="text-align:center;color:var(--gn);padding:40px 0;font-size:14px">✅ 当前无告警</div>';return}
var h='<div class="alist">';
diag.forEach(function(d){
var cls=d.sev==='critical'?'crt':d.sev==='warning'?'wrn':d.type==='conflict'?'mnt':'inf';
var tag=d.sev==='critical'?'紧急':d.sev==='warning'?'警告':'提示';
h+='<div class="acard '+cls+'"><div class="ahdr"><span class="anm">'+d.eq+'</span><span class="atag '+cls+'">'+tag+'</span></div>';
h+='<div style="font-weight:600;color:'+sCol(d.sev==='critical'?'critical':d.sev==='warning'?'warning':'normal')+'">'+d.conc+'</div>';
h+='<div class="adet">'+d.det+'</div>';
if(d.fix)h+='<div class="arec"><span class="rl">🔧 修正建议</span><span class="rv">'+d.fix+'</span></div>';
var so=fSrc(d.src);
h+='<div class="asrc">来源: '+(so?so.name+' | '+so.time:'—')+'</div></div>';
});
h+='</div>';c.innerHTML=h;
}else if(S.tab==='detail'){
var sid=S.selBus||'SS1',s2=fSS(sid);
var h='<div style="font-size:13px;font-weight:700;color:var(--ac);margin-bottom:8px">'+s2.name+' 设备详情</div>';
var relL=D.lines.filter(function(l){return l.from===sid||l.to===sid});
var relSw=D.switches.filter(function(sw2){return sw2.bus===sid});
h+='<table class="dtbl"><tr><th>设备</th><th>类型</th><th>状态</th><th>数值</th></tr>';
h+='<tr><td>'+s2.name+'</td><td>变电站</td><td class="v" style="color:'+sCol(bSt(sid,hr))+'">'+sLbl(bSt(sid,hr))+'</td><td class="v">'+ldAt(sid,hr)+'/'+Math.round(D.loads[sid].cap*gSC().lm)+'MW</td></tr>';
relL.forEach(function(ln){var flow=flAt(ln.id,hr),st=lnSt(ln.id,hr);h+='<tr><td>'+ln.name+'</td><td>线路</td><td class="v" style="color:'+sCol(st)+'">'+sLbl(st)+'</td><td class="v">'+flow+'/'+ln.cap+'MW</td></tr>'});
relSw.forEach(function(sw2){var act=swSt(sw2),isMis=act!==sw2.exp&&!gSC().swOvr[sw2.id];h+='<tr><td>'+sw2.name+'</td><td>断路器</td><td class="v" style="color:'+(isMis?'var(--rd)':act==='closed'?'var(--gn)':'var(--gy)')+'">'+(act==='closed'?'合闸':'分闸')+(isMis?' ⚠误位':'')+'</td><td class="v">'+(act===sw2.exp?'正常':'偏差')+'</td></tr>'});
h+='</table>';
var so=fSrc(D.loads[sid].src);
h+='<div style="margin-top:10px;font-size:10px;color:var(--t3)">数据来源: '+(so?so.name+' | '+so.time:'—')+'</div>';
c.innerHTML=h;
}}

function renderDiag(){
var diag=diagnose(S.hr),dl=document.getElementById('dList'),dc=document.getElementById('dCnt');
dc.textContent=diag.length;
if(diag.length===0){dl.innerHTML='<div style="color:var(--gn);padding:16px;font-size:12px">✅ 当前无诊断问题</div>';return}
var h='';
diag.forEach(function(d){
var cc=d.type==='misposition'?'mis':d.type==='overlimit'?'ovl':'conf';
h+='<div class="dcard"><div class="did">'+d.id+' | '+d.eq+'</div>';
h+='<div class="dconc '+cc+'">'+d.conc+'</div>';
h+='<div class="ddet">'+d.det+'</div>';
if(d.fix)h+='<div class="dfix">🔧 '+d.fix+'</div>';
var so=fSrc(d.src);
h+='<div style="margin-top:4px;font-size:9px;color:var(--t3)">来源: '+(so?so.name:'—')+'</div></div>';
});
dl.innerHTML=h;
}

function renderSources(){
var sl=document.getElementById('sList'),h='';
D.sources.forEach(function(s){
var tc=s.type==='model'?'mdl':s.type==='curve'?'crv':'rpt';
var tl=s.type==='model'?'模':s.type==='curve'?'曲':'报';
h+='<div class="sitem"><div class="sico '+tc+'">'+tl+'</div><span class="snm">'+s.name+'</span><span class="stm">'+s.time.split(' ')[1]+'</span></div>';
});
sl.innerHTML=h;
}

function checkConsist(){
var hr=S.hr,scenario=gSC(),ok=true;
D.substations.forEach(function(s){
var ld=ldAt(s.id,hr),infl=0;
D.lines.forEach(function(ln){if(ln.to===s.id){var f=flAt(ln.id,hr);if(f>0)infl+=f}});
var diff=Math.abs(ld-infl);
if(diff>ld*0.1)ok=false;
});
var bdg=document.getElementById('cBdg');
if(ok){bdg.className='cbdg ok';bdg.textContent='数据一致 ✓'}
else{bdg.className='cbdg err';bdg.textContent='数据偏差 ⚠'}
}

function doExport(){
var hr=S.hr,scenario=gSC(),diag=diagnose(hr);
var txt='========================================\n';
txt+='  电力潮流变电站图 - '+scenario.name+'\n';
txt+='  时刻: '+p2(hr)+':00\n';
txt+='  导出时间: '+new Date().toLocaleString('zh-CN')+'\n';
txt+='========================================\n\n';
if(S.expFmt==='summary'||S.expFmt==='detail'){
txt+='【变电站状态总览】\n';
D.substations.forEach(function(s){
var ld=ldAt(s.id,hr),cp=D.loads[s.id].cap*scenario.lm,st=bSt(s.id,hr);
txt+=s.name+' | 负荷:'+ld+'MW | 容量:'+Math.round(cp)+'MW | 负载率:'+(ld/cp*100).toFixed(1)+'% | 状态:'+sLbl(st)+'\n';
});
txt+='\n【线路潮流】\n';
D.lines.forEach(function(ln){
var flow=flAt(ln.id,hr),st=lnSt(ln.id,hr);
txt+=ln.name+' | 潮流:'+flow+'MW | 容量:'+ln.cap+'MW | 状态:'+sLbl(st)+'\n';
});
txt+='\n【开关状态】\n';
D.switches.forEach(function(sw2){
var act=swSt(sw2),isMis=act!==sw2.exp&&!scenario.swOvr[sw2.id];
txt+=sw2.name+' | 实际:'+(act==='closed'?'合闸':'分闸')+' | 预期:'+(sw2.exp==='closed'?'合闸':'分闸')+(isMis?' | ⚠误位':'')+'\n';
});
}
if(S.expFmt==='detail'){
txt+='\n【负荷曲线数据（MW）】\n';
D.substations.forEach(function(s){
var curve=D.curves[s.id],scaled=curve.map(function(v){return Math.round(v*scenario.lm)});
txt+=s.name+': '+scaled.join(',')+'\n';
});
}
if(S.expFmt!=='detail'){
txt+='\n【诊断结论】\n';
if(diag.length===0)txt+='✅ 当前无诊断问题\n';
diag.forEach(function(d){
txt+='\n'+d.id+' | '+d.eq+'\n';
txt+='  结论: '+d.conc+'\n';
txt+='  详情: '+d.det+'\n';
if(d.fix)txt+='  建议: '+d.fix+'\n';
var so=fSrc(d.src);txt+='  来源: '+(so?so.name+' | '+so.time:'—')+'\n';
});
}
txt+='\n【数据溯源】\n';
D.sources.forEach(function(s){txt+='['+s.id+'] '+s.name+' | '+s.time+'\n'});
var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');a.href=url;
a.download='电力潮流报告_'+scenario.name+'_'+p2(hr)+'00.txt';
document.body.appendChild(a);a.click();document.body.removeChild(a);
URL.revokeObjectURL(url);
}

function updateAll(){
renderDiagram();renderPanel();renderDiag();checkConsist();
document.getElementById('tDisp').textContent=p2(S.hr)+':00';
document.getElementById('tSlider').value=S.hr;
}

document.getElementById('scenSel').addEventListener('change',function(){S.scen=this.value;updateAll()});
document.getElementById('bPrev').addEventListener('click',function(){S.hr=(S.hr+23)%24;updateAll()});
document.getElementById('bNext').addEventListener('click',function(){S.hr=(S.hr+1)%24;updateAll()});
document.getElementById('bPlay').addEventListener('click',function(){
S.playing=!S.playing;
var btn=document.getElementById('bPlay');
if(S.playing){btn.textContent='⏸';btn.classList.add('on');S.pIv=setInterval(function(){S.hr=(S.hr+1)%24;updateAll()},1500)}
else{btn.textContent='▶';btn.classList.remove('on');clearInterval(S.pIv)}
});
document.getElementById('tSlider').addEventListener('input',function(){S.hr=parseInt(this.value);updateAll()});
document.querySelectorAll('.ptab').forEach(function(t){
t.addEventListener('click',function(){
document.querySelectorAll('.ptab').forEach(function(x){x.classList.remove('on')});
this.classList.add('on');S.tab=this.getAttribute('data-tab');renderPanel();
})
});
document.getElementById('expBtn').addEventListener('click',function(){document.getElementById('eModal').classList.add('show')});
document.getElementById('eCancel').addEventListener('click',function(){document.getElementById('eModal').classList.remove('show')});
document.querySelectorAll('.eopt').forEach(function(o){
o.addEventListener('click',function(){
document.querySelectorAll('.eopt').forEach(function(x){x.classList.remove('sel')});
this.classList.add('sel');S.expFmt=this.getAttribute('data-fmt');
})
});
document.getElementById('eConfirm').addEventListener('click',function(){doExport();document.getElementById('eModal').classList.remove('show')});

renderSources();
updateAll();
})();
</script>
</body>
</html>
