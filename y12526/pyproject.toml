[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fraud-graph-analyzer"
version = "0.1.0"
description = "图论社群欺诈筛查分析工具"
authors = ["Risk Analytics Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
networkx = "^3.2"
pandas = "^2.1"
numpy = "^1.26"
pyvis = "^0.3.2"
python-dateutil = "^2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
