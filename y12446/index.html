<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声学剧场调音战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>声学剧场调音战</h1>
            <div class="status-bar">
                <span id="level-info">关卡 1/3</span>
                <span id="score-info">得分: 0</span>
                <span id="time-info">时间: 60s</span>
            </div>
        </header>

        <main>
            <div class="game-area">
                <div class="stage-container">
                    <canvas id="stage-canvas" width="800" height="500"></canvas>
                    <div id="problem-indicator" class="problem-indicator hidden"></div>
                </div>

                <aside class="control-panel">
                    <div class="panel-section">
                        <h3>舞台声源</h3>
                        <div class="source-list" id="source-list"></div>
                    </div>

                    <div class="panel-section">
                        <h3>麦克风</h3>
                        <div class="mic-list" id="mic-list"></div>
                        <button id="add-mic-btn" class="btn">添加麦克风</button>
                    </div>

                    <div class="panel-section">
                        <h3>反馈灯设置</h3>
                        <div class="feedback-control">
                            <label>反馈灯口径:</label>
                            <input type="range" id="feedback-aperture" min="1" max="10" value="5">
                            <span id="aperture-value">5</span>
                        </div>
                        <div class="feedback-effect" id="feedback-effect"></div>
                    </div>

                    <div class="panel-section">
                        <h3>声场调节</h3>
                        <div class="sliders">
                            <div class="slider-group">
                                <label>音量</label>
                                <input type="range" id="volume-slider" min="0" max="100" value="70">
                                <span id="volume-value">70</span>
                            </div>
                            <div class="slider-group">
                                <label>混响</label>
                                <input type="range" id="reverb-slider" min="0" max="100" value="30">
                                <span id="reverb-value">30</span>
                            </div>
                            <div class="slider-group">
                                <label>延迟</label>
                                <input type="range" id="delay-slider" min="0" max="100" value="20">
                                <span id="delay-value">20</span>
                            </div>
                            <div class="slider-group">
                                <label>均衡(高频)</label>
                                <input type="range" id="eq-high-slider" min="-50" max="50" value="0">
                                <span id="eq-high-value">0</span>
                            </div>
                            <div class="slider-group">
                                <label>均衡(低频)</label>
                                <input type="range" id="eq-low-slider" min="-50" max="50" value="0">
                                <span id="eq-low-value">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3>问题处理</h3>
                        <div id="problem-list" class="problem-list"></div>
                    </div>

                    <div class="panel-actions">
                        <button id="check-btn" class="btn btn-primary">检测声场</button>
                        <button id="replay-btn" class="btn">复盘模式</button>
                        <button id="next-level-btn" class="btn btn-success">下一关</button>
                    </div>
                </aside>
            </div>

            <div id="replay-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>复盘报告</h2>
                    <div id="replay-content"></div>
                    <div class="modal-actions">
                        <button id="export-btn" class="btn btn-primary">导出成绩</button>
                        <button id="close-replay-btn" class="btn">关闭</button>
                    </div>
                </div>
            </div>

            <div id="fail-modal" class="modal hidden">
                <div class="modal-content fail-content">
                    <h2>调音失败</h2>
                    <div id="fail-reason"></div>
                    <div class="modal-actions">
                        <button id="retry-btn" class="btn btn-primary">重试</button>
                        <button id="view-replay-btn" class="btn">查看复盘</button>
                    </div>
                </div>
            </div>

            <div id="success-modal" class="modal hidden">
                <div class="modal-content success-content">
                    <h2>调音成功！</h2>
                    <div id="success-info"></div>
                    <div class="modal-actions">
                        <button id="next-btn" class="btn btn-primary">下一关</button>
                        <button id="view-success-replay-btn" class="btn">查看复盘</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="data/levels.js"></script>
    <script src="js/acoustics.js"></script>
    <script src="js/problems.js"></script>
    <script src="js/replay.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
