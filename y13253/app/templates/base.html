<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}夜市外摆方案比选{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        .header-nav a:hover {
            text-decoration: underline;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .card h3 {
            font-size: 16px;
            margin: 16px 0 10px;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
        }
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        .btn-warning:hover {
            background: #e67e22;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-draft { background: #ecf0f1; color: #7f8c8d; }
        .status-reviewing { background: #fef9e7; color: #f39c12; }
        .status-pending { background: #fdebd0; color: #e67e22; }
        .status-confirmed { background: #d5f4e6; color: #27ae60; }
        .status-approved { background: #d6eaf8; color: #2980b9; }
        .status-rejected { background: #fadbd8; color: #e74c3c; }
        .status-obsolete { background: #eaeaea; color: #999; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th, table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        table th {
            background: #f8f9fa;
            font-weight: 600;
        }
        table tr:hover {
            background: #f8f9fa;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #2c3e50;
        }
        .stat-label {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .remark-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .remark-meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }
        .remark-content {
            font-size: 14px;
        }
        .record-item {
            padding: 12px;
            border-left: 3px solid #ddd;
            padding-left: 12px;
            margin-bottom: 10px;
        }
        .record-affecting {
            border-left-color: #e74c3c;
            background: #fdf6f5;
        }
        .record-old {
            border-left-color: #f39c12;
            background: #fef9e7;
        }
        .record-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .record-meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }
        .record-content {
            font-size: 13px;
            color: #666;
        }
        .version-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .version-current {
            background: #e8f6f3;
            border: 1px solid #1abc9c;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .alert-warning {
            background: #fef9e7;
            border: 1px solid #f39c12;
            color: #b7950b;
        }
        .alert-info {
            background: #ebf5fb;
            border: 1px solid #3498db;
            color: #2874a6;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-size: 14px;
        }
        .tab.active {
            border-bottom-color: #3498db;
            color: #3498db;
            font-weight: 600;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .markdown-body {
            padding: 20px;
            background: #fafafa;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .markdown-body h1 { font-size: 22px; margin: 0 0 16px; }
        .markdown-body h2 { font-size: 18px; margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
        .markdown-body h3 { font-size: 16px; margin: 16px 0 8px; }
        .markdown-body p { margin: 8px 0; }
        .markdown-body ul, .markdown-body ol { margin: 8px 0; padding-left: 24px; }
        .markdown-body table { margin: 12px 0; }
        .markdown-body blockquote {
            border-left: 4px solid #ddd;
            padding-left: 12px;
            color: #666;
            margin: 12px 0;
        }
        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .inline-form {
            display: inline;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>🏮 夜市外摆方案比选</h1>
            <nav class="header-nav">
                <a href="{{ url_for('index') }}">首页</a>
            </nav>
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
