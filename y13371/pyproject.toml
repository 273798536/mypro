[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "training-queue-snapshot"
version = "0.1.0"
description = "训练队列版本快照 - MLOps训练数据质量管理工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
tqs = "training_queue_snapshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
