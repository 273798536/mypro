[project]
name = "compliance-log-check"
version = "0.1.0"
description = "合规日志脱敏检查工具 - 支持灰度对比、分布统计、评测回放"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
compliance-check = "compliance_check.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
