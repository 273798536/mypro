[project]
name = "buoy-report"
version = "1.0.0"
description = "海浪浮标报告导出系统"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
buoy-report = "buoy_report.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
