[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-schedule-inspector"
version = "0.1.0"
description = "银行网点排班多源导入巡检工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
bsi = "bank_schedule_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
