[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "train-dedup-cli"
version = "0.1.0"
description = "训练集近重复清洗 CLI - AI/ML 工作流工具，用于样本去重、版本追踪、训练验证泄漏检测"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Algorithm PM Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
train-dedup = "train_dedup.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["train_dedup*"]

[tool.setuptools.package-data]
train_dedup = ["py.typed"]
