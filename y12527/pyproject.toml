[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-noise-cleaner"
version = "0.1.0"
description = "傅里叶噪声清洗CLI - 音频噪声清洗与分析工具"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "soundfile>=0.10.0",
    "click>=8.0.0",
    "rich>=10.0.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "PyYAML>=5.4.0",
]

[project.scripts]
fnc = "fourier_noise_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
