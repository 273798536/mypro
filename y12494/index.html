<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>钢琴共振可视琴房</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>🎹 钢琴共振可视琴房</h1>
      
      <div class="section">
        <h3>📂 模型管理</h3>
        <input type="file" id="modelInput" accept=".json">
        <button id="loadDemoModel">加载演示模型</button>
      </div>

      <div class="section">
        <h3>🎵 琴弦分组</h3>
        <div id="stringGroups"></div>
        <button id="addGroup">添加分组</button>
      </div>

      <div class="section">
        <h3>🎼 音符事件</h3>
        <div id="noteEvents"></div>
        <button id="addNoteEvent">添加事件</button>
      </div>

      <div class="section">
        <h3>⚙️ 共振参数</h3>
        <label>共振强度: <span id="resonanceValue">0.5</span></label>
        <input type="range" id="resonanceSlider" min="0" max="1" step="0.01" value="0.5">
        <div class="warning" id="resonanceWarning" style="display:none;">⚠️ 共振强度过高，可能产生异常</div>
      </div>

      <div class="section">
        <h3>💾 数据管理</h3>
        <button id="exportData">导出数据</button>
        <input type="file" id="importData" accept=".json" style="display:none">
        <button id="importDataBtn">导入数据</button>
        <button id="takeScreenshot">截图导出</button>
      </div>
    </div>

    <div id="mainArea">
      <div id="canvasContainer"></div>
      
      <div id="timeline">
        <div class="timeline-header">
          <span>⏱️ 时间轴</span>
          <div class="timeline-controls">
            <button id="playBtn">▶️ 播放</button>
            <button id="pauseBtn">⏸️ 暂停</button>
            <button id="resetBtn">⏮️ 重置</button>
            <span id="currentTime">0.00s</span>
          </div>
        </div>
        <div id="timelineTracks"></div>
      </div>
    </div>

    <div id="infoPanel">
      <h3>📊 当前状态</h3>
      <div id="statusInfo"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
