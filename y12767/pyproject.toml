[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nh3n-explainer"
version = "0.1.0"
description = "氨氮监测异常解释工具 - 异常检测、配平计算、报告生成"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
nh3n = "nh3n_explainer.cli:main"

[tool.setuptools.packages.find]
include = ["nh3n_explainer*"]
