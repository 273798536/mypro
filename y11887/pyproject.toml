[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-backtester"
version = "1.0.0"
description = "报价阶梯反推器 - 从最终报价反查折扣阶梯、审批级别和舍入口径"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Quote Backtester Team"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
quote-backtester = "quote_backtester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
