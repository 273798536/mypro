[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-reconcile"
version = "0.1.0"
description = "券商对账差异CLI - 处理成交确认与资金流水比对"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "plotly>=5.14.0",
    "kaleido>=0.2.1",
]

[project.scripts]
broker-reconcile = "broker_reconcile.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["broker_reconcile*"]
