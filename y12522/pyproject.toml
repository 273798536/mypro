[project]
name = "schedule-validator"
version = "0.1.0"
description = "组合计数排课校验 - 批量处理课程清单、老师时间、教室容量的排课校验工具"
requires-python = ">=3.10"
authors = [{ name = "教务排课团队" }]
dependencies = [
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
schedule-validator = "schedule_validator.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["schedule_validator*"]
