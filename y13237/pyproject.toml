[project]
name = "qinarchive"
version = "0.1.0"
description = "琴房课时清单归档工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
qinarchive = "qinarchive.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
