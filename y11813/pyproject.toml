[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdpay-frozen"
version = "0.1.0"
description = "众包工资冻结发放处理工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
crowdpay = "crowdpay_frozen.cli:main"
