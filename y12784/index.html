<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合成路线步骤审计</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7fa;--card:#fff;--border:#e2e8f0;--primary:#1a56db;--primary-light:#e8edfb;--danger:#dc2626;--danger-light:#fef2f2;--warning:#d97706;--warning-light:#fffbeb;--success:#059669;--success-light:#ecfdf5;--text:#1e293b;--text-secondary:#64748b;--text-muted:#94a3b8;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{background:linear-gradient(135deg,#1e3a5f,#1a56db);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.header-actions{display:flex;gap:12px}
.btn{padding:8px 18px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn-primary:hover{background:#f0f4ff;transform:translateY(-1px)}
.btn-export{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-export:hover{background:rgba(255,255,255,.25)}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#047857}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#b45309}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.container{max-width:1440px;margin:0 auto;padding:24px 32px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.stat-card.danger{border-left-color:var(--danger)}
.stat-card.warning{border-left-color:var(--warning)}
.stat-card.success{border-left-color:var(--success)}
.stat-label{font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.stat-value{font-size:28px;font-weight:700}
.stat-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fafbfc}
.panel-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-body{padding:20px}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f8fafc;text-align:left;padding:12px 14px;font-weight:600;font-size:13px;color:var(--text-secondary);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-info{background:var(--primary-light);color:var(--primary)}
.anomaly-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500;margin:2px 2px}
.anomaly-supplement{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.anomaly-correction{background:#fce7f3;color:#9d174d;border:1px solid #f9a8d4}
.anomaly-ok{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7}
.note-original{background:#fffbeb;border-left:3px solid #f59e0b;padding:8px 12px;margin:4px 0;border-radius:0 4px 4px 0;font-size:13px;color:#78350f;font-style:italic}
.explanation-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #93c5fd;border-radius:var(--radius);padding:16px 20px;margin:16px 0;position:relative}
.explanation-box .label{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.explanation-box .text{font-size:14px;color:#1e3a5f;line-height:1.8}
.explanation-box .copy-btn{position:absolute;top:12px;right:12px;background:var(--primary);color:#fff;border:none;padding:4px 12px;border-radius:4px;font-size:12px;cursor:pointer}
.explanation-box .copy-btn:hover{opacity:.9}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-container{position:relative;height:280px}
.detail-row{cursor:pointer}
.detail-row:hover td{background:#eef2ff}
.detail-panel{display:none;background:#f8fafc}
.detail-panel.open{display:table-row}
.detail-panel td{padding:0}
.detail-inner{padding:20px 24px;border-left:4px solid var(--primary)}
.detail-section{margin-bottom:16px}
.detail-section h4{font-size:14px;font-weight:600;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.detail-section p{font-size:14px;color:var(--text);line-height:1.7}
.action-box{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:var(--radius);margin:4px 0;font-size:13px;font-weight:500}
.action-supplement{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.action-correction{background:#fce7f3;color:#9d174d;border:1px solid #f9a8d4}
.weighing-section{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.weighing-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.weighing-form label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px}
.weighing-form input,.weighing-form select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:4px;font-size:14px}
.spectrum-indicator{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:4px;font-size:13px;margin:4px 0}
.spectrum-outdated{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}
.spectrum-updated{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7}
.spectrum-pending{background:#fffbeb;color:#92400e;border:1px solid #fcd34d}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:800px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h2{font-size:18px;font-weight:600}
.modal-body{padding:24px}
.report-section{margin-bottom:24px}
.report-section h3{font-size:16px;font-weight:600;color:var(--primary);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--primary-light)}
.report-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
.report-table th{background:#f1f5f9;padding:10px 12px;text-align:left;font-size:12px}
.report-table td{padding:10px 12px;border-bottom:1px solid #e2e8f0}
.report-explanation{background:#eff6ff;border-left:4px solid #3b82f6;padding:14px 18px;margin:12px 0;border-radius:0 8px 8px 0;font-size:14px;line-height:1.8;color:#1e3a5f}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 24px;border-radius:var(--radius);font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(100px);opacity:0;transition:all .3s;z-index:300}
.toast.show{transform:translateY(0);opacity:1}
.batch-highlight{font-family:monospace;background:#fef3c7;padding:2px 6px;border-radius:3px;font-size:13px}
.filter-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:6px 12px;border:1px solid var(--border);border-radius:4px;font-size:13px}
.empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:14px}
.responsive-table{overflow-x:auto}
@media(max-width:1024px){.chart-row{grid-template-columns:1fr}.stats-bar{grid-template-columns:repeat(2,1fr)}}
@media print{.header{position:static;background:#1e3a5f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.btn,.tabs,.filter-bar{display:none!important}.panel{box-shadow:none;border:1px solid #ddd}.stat-card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<div class="header">
  <h1>合成路线步骤审计</h1>
  <div class="header-actions">
    <button class="btn btn-export" onclick="openExportModal()">导出报告</button>
    <button class="btn btn-primary" onclick="runFullAudit()">运行审计</button>
  </div>
</div>

<div class="container">
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-label">审计步骤总数</div><div class="stat-value" id="statTotal">0</div><div class="stat-sub">含所有合成路线步骤</div></div>
    <div class="stat-card danger"><div class="stat-label">异常记录</div><div class="stat-value" id="statAnomaly">0</div><div class="stat-sub">需安全员关注</div></div>
    <div class="stat-card warning"><div class="stat-label">待补录</div><div class="stat-value" id="statPending">0</div><div class="stat-sub">称量单未完成</div></div>
    <div class="stat-card success"><div class="stat-label">已通过</div><div class="stat-value" id="statPassed">0</div><div class="stat-sub">图/表/文对齐</div></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">审计详情</div>
      <div class="filter-bar">
        <select id="filterStatus" onchange="applyFilter()"><option value="all">全部状态</option><option value="anomaly">仅异常</option><option value="pending">待补录</option><option value="passed">已通过</option></select>
        <select id="filterRoute" onchange="applyFilter()"><option value="all">全部路线</option></select>
        <input type="text" id="filterBatch" placeholder="搜索批号..." oninput="applyFilter()">
      </div>
    </div>
    <div class="panel-body">
      <div class="tabs">
        <div class="tab active" data-tab="table" onclick="switchTab('table')">步骤列表</div>
        <div class="tab" data-tab="chart" onclick="switchTab('chart')">可视化图表</div>
        <div class="tab" data-tab="explanation" onclick="switchTab('explanation')">普通话解释</div>
      </div>

      <div class="tab-content active" id="tabTable">
        <div class="responsive-table">
          <table>
            <thead>
              <tr>
                <th>步骤</th>
                <th>路线</th>
                <th>批号</th>
                <th>操作内容</th>
                <th>称量单</th>
                <th>谱图判读</th>
                <th>状态</th>
                <th>异常分类</th>
                <th>人工备注</th>
              </tr>
            </thead>
            <tbody id="auditTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-content" id="tabChart">
        <div class="chart-row">
          <div class="panel" style="margin:0"><div class="panel-header"><span class="panel-title">异常类型分布</span></div><div class="panel-body"><div class="chart-container"><canvas id="chartAnomalyType"></canvas></div></div></div>
          <div class="panel" style="margin:0"><div class="panel-header"><span class="panel-title">各路线步骤状态</span></div><div class="panel-body"><div class="chart-container"><canvas id="chartRouteStatus"></canvas></div></div></div>
        </div>
        <div class="chart-row">
          <div class="panel" style="margin:0"><div class="panel-header"><span class="panel-title">称量单完成率</span></div><div class="panel-body"><div class="chart-container"><canvas id="chartWeighing"></canvas></div></div></div>
          <div class="panel" style="margin:0"><div class="panel-header"><span class="panel-title">谱图判读状态</span></div><div class="panel-body"><div class="chart-container"><canvas id="chartSpectrum"></canvas></div></div></div>
        </div>
        <div id="chartTextSummary" style="background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px">
          <h4 style="font-size:14px;color:var(--primary);margin-bottom:8px">图表与表格数据一致性校验</h4>
          <div id="chartConsistency"></div>
        </div>
      </div>

      <div class="tab-content" id="tabExplanation">
        <div id="explanationList"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <div class="modal-header">
      <h2>导出审计报告</h2>
      <button class="btn btn-outline" onclick="closeExportModal()">关闭</button>
    </div>
    <div class="modal-body" id="reportContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SAMPLE_DATA = [
  {
    id:1, step:"步骤1", route:"路线A-01", batchNo:"PA-2024-0031",
    operation:"原料称量与溶解", weighingStatus:"complete", spectrumStatus:"pass",
    anomalies:[], manualNote:"",
    weighingData:{reagent:"对甲苯磺酸",actual:"12.48g",target:"12.50g",operator:"张三"},
    spectrumData:{method:"HPLC",result:"纯度99.2%",conclusion:"合格"}
  },
  {
    id:2, step:"步骤2", route:"路线A-01", batchNo:"PA-2024-0031",
    operation:"酯化反应投料", weighingStatus:"complete", spectrumStatus:"pass",
    anomalies:[], manualNote:"",
    weighingData:{reagent:"甲醇",actual:"50.2mL",target:"50.0mL",operator:"张三"},
    spectrumData:{method:"GC-MS",result:"酯化率96.8%",conclusion:"合格"}
  },
  {
    id:3, step:"步骤3", route:"路线A-01", batchNo:"PA-2024-0031",
    operation:"回流反应4h", weighingStatus:"missing", spectrumStatus:"outdated",
    anomalies:[{type:"supplement",desc:"称量单缺失，需补录催化剂用量"},{type:"correction",desc:"谱图判读结果过时，需根据补录数据更新"}],
    manualNote:"催化剂当时是临时加的，用量记在实验台便签上了",
    weighingData:null, spectrumData:{method:"HPLC",result:"纯度94.1%",conclusion:"待确认"}
  },
  {
    id:4, step:"步骤1", route:"路线B-02", batchNo:"PB-2024-0015",
    operation:"底物投料", weighingStatus:"complete", spectrumStatus:"pass",
    anomalies:[], manualNote:"",
    weighingData:{reagent:"苯甲醛",actual:"10.62g",target:"10.60g",operator:"李四"},
    spectrumData:{method:"NMR",result:"结构与标准品一致",conclusion:"合格"}
  },
  {
    id:5, step:"步骤2", route:"路线B-02", batchNo:"PB-2024-0015",
    operation:"格氏试剂制备", weighingStatus:"complete", spectrumStatus:"pending_review",
    anomalies:[{type:"supplement",desc:"谱图判读需人工复核，滴定终点颜色偏深"}],
    manualNote:"镁粉表面氧化严重，活化时间比平时长了20分钟",
    weighingData:{reagent:"镁粉",actual:"2.43g",target:"2.40g",operator:"李四"},
    spectrumData:{method:"IR",result:"特征峰偏移2cm-1",conclusion:"待复核"}
  },
  {
    id:6, step:"步骤1", route:"路线A-01", batchNo:"PA-2024-0031",
    operation:"原料称量（复用批号）", weighingStatus:"complete", spectrumStatus:"pass",
    anomalies:[{type:"correction",desc:"批号PA-2024-0031重复出现于步骤1，该步骤的操作内容与步骤1原始记录不同，需核实是否为分批投料或录入错误"}],
    manualNote:"这批是补称的第二批，同一天分两次投的料",
    weighingData:{reagent:"对甲苯磺酸",actual:"12.52g",target:"12.50g",operator:"张三"},
    spectrumData:{method:"HPLC",result:"纯度99.1%",conclusion:"合格"}
  },
  {
    id:7, step:"步骤1", route:"路线C-03", batchNo:"PC-2024-0008",
    operation:"起始原料预处理", weighingStatus:"partial", spectrumStatus:"pending_review",
    anomalies:[{type:"supplement",desc:"称量单不完整，缺少干燥减量数据"},{type:"supplement",desc:"谱图判读待确认，原料含水量可能超标"}],
    manualNote:"当天湿度大，原料在通风橱里晾了2小时再称的",
    weighingData:{reagent:"三乙胺",actual:"—",target:"20.0mL",operator:"王五"},
    spectrumData:{method:"Karl Fischer",result:"含水0.8%",conclusion:"待确认"}
  },
  {
    id:8, step:"步骤2", route:"路线C-03", batchNo:"PC-2024-0008",
    operation:"缩合反应", weighingStatus:"complete", spectrumStatus:"fail",
    anomalies:[{type:"correction",desc:"谱图判读不合格，产物中检出未知杂质峰"}],
    manualNote:"",
    weighingData:{reagent:"EDC·HCl",actual:"5.75g",target:"5.76g",operator:"王五"},
    spectrumData:{method:"LC-MS",result:"检出m/z 327.2杂质",conclusion:"不合格"}
  },
  {
    id:9, step:"步骤3", route:"路线C-03", batchNo:"PC-2024-0008",
    operation:"柱层析纯化", weighingStatus:"complete", spectrumStatus:"pass",
    anomalies:[], manualNote:"用了个新批次的硅胶，流速比以前快",
    weighingData:{reagent:"硅胶200-300目",actual:"500g",target:"500g",operator:"王五"},
    spectrumData:{method:"HPLC",result:"纯度99.6%",conclusion:"合格"}
  },
  {
    id:10, step:"步骤1", route:"路线B-02", batchNo:"PB-2024-0015",
    operation:"底物投料（复用批号）", weighingStatus:"complete", spectrumStatus:"pass",
    anomalies:[{type:"correction",desc:"批号PB-2024-0015重复出现于步骤1，需确认是否为重复投料"}],
    manualNote:"同上，这批料分两锅做的",
    weighingData:{reagent:"苯甲醛",actual:"10.58g",target:"10.60g",operator:"李四"},
    spectrumData:{method:"NMR",result:"结构与标准品一致",conclusion:"合格"}
  }
];

let auditData = JSON.parse(JSON.stringify(SAMPLE_DATA));
let charts = {};
let openDetailId = null;

function getStatus(step) {
  if (step.anomalies.length > 0) {
    const hasCorrection = step.anomalies.some(a => a.type === 'correction');
    const hasSupplement = step.anomalies.some(a => a.type === 'supplement');
    if (hasCorrection && hasSupplement) return 'anomaly';
    if (hasCorrection) return 'anomaly';
    return 'pending';
  }
  if (step.weighingStatus === 'missing' || step.weighingStatus === 'partial') return 'pending';
  if (step.spectrumStatus === 'outdated' || step.spectrumStatus === 'pending_review') return 'pending';
  return 'passed';
}

function getStatusBadge(status) {
  const map = {
    anomaly: '<span class="badge badge-danger">异常</span>',
    pending: '<span class="badge badge-warning">待处理</span>',
    passed: '<span class="badge badge-success">已通过</span>'
  };
  return map[status] || '';
}

function getWeighingBadge(status) {
  const map = {
    complete: '<span class="badge badge-success">已填写</span>',
    partial: '<span class="badge badge-warning">不完整</span>',
    missing: '<span class="badge badge-danger">缺失</span>'
  };
  return map[status] || status;
}

function getSpectrumBadge(status) {
  const map = {
    pass: '<span class="badge badge-success">合格</span>',
    fail: '<span class="badge badge-danger">不合格</span>',
    pending_review: '<span class="badge badge-warning">待复核</span>',
    outdated: '<span class="badge badge-danger">已过时</span>'
  };
  return map[status] || status;
}

function getAnomalyTags(anomalies) {
  if (!anomalies.length) return '<span class="anomaly-tag anomaly-ok">无异常</span>';
  return anomalies.map(a => {
    if (a.type === 'supplement') return `<span class="anomaly-tag anomaly-supplement">📋 补材料</span>`;
    if (a.type === 'correction') return `<span class="anomaly-tag anomaly-correction">✏️ 改口径</span>`;
    return `<span class="anomaly-tag">${a.type}</span>`;
  }).join(' ');
}

function getActionBox(anomalies) {
  if (!anomalies.length) return '';
  let html = '<div style="margin-top:6px">';
  anomalies.forEach(a => {
    if (a.type === 'supplement') {
      html += `<div class="action-box action-supplement">📋 补材料：${a.desc}</div>`;
    } else if (a.type === 'correction') {
      html += `<div class="action-box action-correction">✏️ 改口径：${a.desc}</div>`;
    }
  });
  html += '</div>';
  return html;
}

function getNoteHtml(note) {
  if (!note) return '<span style="color:var(--text-muted)">—</span>';
  return `<div class="note-original">"${note}"</div>`;
}

function getSpectrumIndicator(step) {
  if (step.weighingStatus === 'missing' || step.weighingStatus === 'partial') {
    if (step.spectrumStatus === 'outdated') {
      return '<div class="spectrum-indicator spectrum-outdated">⚠️ 谱图判读已过时，称量单补录后需同步更新</div>';
    }
    if (step.spectrumStatus === 'pending_review') {
      return '<div class="spectrum-indicator spectrum-pending">🕐 谱图判读待复核，补录称量数据后请重新判读</div>';
    }
  }
  if (step.spectrumStatus === 'fail') {
    return '<div class="spectrum-indicator spectrum-outdated">✖ 谱图判读不合格，需排查原因</div>';
  }
  return '<div class="spectrum-indicator spectrum-updated">✔ 谱图判读为最新状态</div>';
}

function renderTable() {
  const filterStatus = document.getElementById('filterStatus').value;
  const filterRoute = document.getElementById('filterRoute').value;
  const filterBatch = document.getElementById('filterBatch').value.trim();
  
  let filtered = auditData.filter(step => {
    const status = getStatus(step);
    if (filterStatus !== 'all' && status !== filterStatus) return false;
    if (filterRoute !== 'all' && step.route !== filterRoute) return false;
    if (filterBatch && !step.batchNo.toLowerCase().includes(filterBatch.toLowerCase())) return false;
    return true;
  });

  const tbody = document.getElementById('auditTableBody');
  let html = '';
  
  filtered.forEach(step => {
    const status = getStatus(step);
    const isOpen = openDetailId === step.id;
    
    html += `<tr class="detail-row" onclick="toggleDetail(${step.id})">
      <td>${step.step}</td>
      <td>${step.route}</td>
      <td><span class="batch-highlight">${step.batchNo}</span></td>
      <td>${step.operation}</td>
      <td>${getWeighingBadge(step.weighingStatus)}</td>
      <td>${getSpectrumBadge(step.spectrumStatus)}</td>
      <td>${getStatusBadge(status)}</td>
      <td>${getAnomalyTags(step.anomalies)}</td>
      <td>${step.manualNote ? '📝' : '—'}</td>
    </tr>`;
    
    html += `<tr class="detail-panel ${isOpen ? 'open' : ''}" id="detail-${step.id}">
      <td colspan="9">
        <div class="detail-inner">
          <div class="detail-section">
            <h4>📋 异常分类与处理建议</h4>
            ${getActionBox(step.anomalies) || '<p style="color:var(--text-muted)">该步骤无异常</p>'}
          </div>
          <div class="detail-section">
            <h4>⚖️ 称量单信息</h4>
            ${step.weighingData ? `
              <table style="font-size:13px;max-width:500px">
                <tr><td style="width:100px;color:var(--text-secondary)">试剂</td><td>${step.weighingData.reagent}</td></tr>
                <tr><td style="color:var(--text-secondary)">目标量</td><td>${step.weighingData.target}</td></tr>
                <tr><td style="color:var(--text-secondary)">实际量</td><td>${step.weighingData.actual}</td></tr>
                <tr><td style="color:var(--text-secondary)">操作人</td><td>${step.weighingData.operator}</td></tr>
              </table>
            ` : '<p style="color:var(--danger)">称量单缺失</p>'}
            ${step.weighingStatus === 'missing' || step.weighingStatus === 'partial' ? `
              <div class="weighing-section">
                <h4 style="font-size:14px;margin-bottom:12px">补录称量单</h4>
                <div class="weighing-form">
                  <div><label>试剂名称</label><input type="text" id="wReagent-${step.id}" placeholder="输入试剂名"></div>
                  <div><label>目标量</label><input type="text" id="wTarget-${step.id}" placeholder="如 12.50g"></div>
                  <div><label>实际量</label><input type="text" id="wActual-${step.id}" placeholder="如 12.48g"></div>
                  <button class="btn btn-primary btn-sm" onclick="supplementWeighing(${step.id},event)">补录</button>
                </div>
              </div>
            ` : ''}
          </div>
          <div class="detail-section">
            <h4>📊 谱图判读</h4>
            ${step.spectrumData ? `
              <table style="font-size:13px;max-width:500px">
                <tr><td style="width:100px;color:var(--text-secondary)">检测方法</td><td>${step.spectrumData.method}</td></tr>
                <tr><td style="color:var(--text-secondary)">检测结果</td><td>${step.spectrumData.result}</td></tr>
                <tr><td style="color:var(--text-secondary)">结论</td><td>${step.spectrumData.conclusion}</td></tr>
              </table>
            ` : ''}
            ${getSpectrumIndicator(step)}
            ${step.spectrumStatus === 'outdated' || step.spectrumStatus === 'pending_review' ? `
              <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="updateSpectrum(${step.id},event)">更新谱图判读</button>
            ` : ''}
          </div>
          ${step.manualNote ? `
          <div class="detail-section">
            <h4>📝 人工备注（原话保留）</h4>
            ${getNoteHtml(step.manualNote)}
          </div>` : ''}
          <div class="detail-section">
            <h4>💬 普通话解释</h4>
            <div class="explanation-box">
              <div class="label">安全员可直接复制以下说明：</div>
              <div class="text" id="explanation-${step.id}">${generateExplanation(step)}</div>
              <button class="copy-btn" onclick="copyExplanation(${step.id})">复制</button>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
  });
  
  if (!filtered.length) {
    html = '<tr><td colspan="9" class="empty-state">无匹配记录</td></tr>';
  }
  
  tbody.innerHTML = html;
}

function toggleDetail(id) {
  openDetailId = openDetailId === id ? null : id;
  renderTable();
}

function generateExplanation(step) {
  const status = getStatus(step);
  let text = '';
  
  if (step.anomalies.some(a => a.desc && a.desc.includes('批号') && a.desc.includes('重复'))) {
    text += `批号${step.batchNo}在${step.route}中被发现重复出现。`;
    const batchSteps = auditData.filter(s => s.batchNo === step.batchNo);
    if (batchSteps.length > 1) {
      text += `该批号共出现在${batchSteps.length}条步骤记录中（${batchSteps.map(s=>s.step).join('、')}）。`;
    }
    if (step.manualNote && step.manualNote.includes('分') && (step.manualNote.includes('批') || step.manualNote.includes('锅'))) {
      text += `根据操作人备注，这是分批投料，需要在系统中补充"分批投料"的说明材料，而不是修改原有记录口径。`;
    } else {
      text += `需要核实：如果确实是分批投料，请补充分批说明材料；如果是录入错误，请修正批号后重新提交。`;
    }
    text += `  `;
  }
  
  if (step.weighingStatus === 'missing') {
    text += `${step.route}的${step.operation}步骤，称量单目前缺失，无法确认实际投料量与配方是否一致。请尽快补录称量单数据，补录后谱图判读也需要同步更新。  `;
  } else if (step.weighingStatus === 'partial') {
    text += `${step.route}的${step.operation}步骤，称量单不完整（缺少部分数据），需要补充完整后才能确认投料准确性。补录完成后，谱图判读也需同步更新。  `;
  }
  
  if (step.spectrumStatus === 'outdated') {
    text += `${step.route}的${step.operation}步骤，当前谱图判读结果已过时，因为称量单数据已发生变化。请在补录称量单后，重新进行谱图判读并更新结论。  `;
  } else if (step.spectrumStatus === 'pending_review') {
    text += `${step.route}的${step.operation}步骤，谱图判读结果待人工复核，可能存在数据偏差。建议在补录称量单数据后，一并重新判读。  `;
  } else if (step.spectrumStatus === 'fail') {
    text += `${step.route}的${step.operation}步骤，谱图判读不合格（${step.spectrumData ? step.spectrumData.result : ''}），需要排查反应条件或操作流程是否存在偏差。  `;
  }
  
  step.anomalies.forEach(a => {
    if (a.type === 'supplement' && !a.desc.includes('批号')) {
      text += `${a.desc}。下一步需要补充相关材料。  `;
    } else if (a.type === 'correction' && !a.desc.includes('批号')) {
      text += `${a.desc}。下一步需要修正记录口径或重新确认。  `;
    }
  });
  
  if (step.manualNote) {
    text += `操作人备注原话："${step.manualNote}"。`;
  }
  
  if (status === 'passed') {
    text = `${step.route}的${step.operation}步骤，称量单完整、谱图判读合格、无异常记录，审计通过。`;
  }
  
  return text.trim() || '该步骤暂无需要特别说明的内容。';
}

function copyExplanation(id) {
  const el = document.getElementById(`explanation-${id}`);
  if (el) {
    navigator.clipboard.writeText(el.textContent).then(() => showToast('已复制到剪贴板'));
  }
}

function supplementWeighing(id, event) {
  event.stopPropagation();
  const reagent = document.getElementById(`wReagent-${id}`).value.trim();
  const target = document.getElementById(`wTarget-${id}`).value.trim();
  const actual = document.getElementById(`wActual-${id}`).value.trim();
  
  if (!reagent || !target || !actual) {
    showToast('请填写完整的称量单信息');
    return;
  }
  
  const step = auditData.find(s => s.id === id);
  if (step) {
    step.weighingData = { reagent, target, actual, operator: '补录' };
    step.weighingStatus = 'complete';
    
    if (step.spectrumStatus === 'outdated') {
      step.spectrumStatus = 'pending_review';
      step.spectrumData.conclusion = '待确认（称量单已补录，需重新判读）';
    }
    
    step.anomalies = step.anomalies.filter(a => a.type !== 'supplement' || a.desc.includes('批号'));
    
    showToast(`步骤${step.step}称量单已补录，谱图判读状态已同步更新为"待复核"`);
    renderAll();
  }
}

function updateSpectrum(id, event) {
  event.stopPropagation();
  const step = auditData.find(s => s.id === id);
  if (step) {
    step.spectrumStatus = 'pass';
    step.spectrumData.conclusion = '合格（已根据补录数据更新）';
    
    step.anomalies = step.anomalies.filter(a => {
      if (a.type === 'correction' && a.desc.includes('谱图')) return false;
      if (a.type === 'supplement' && a.desc.includes('谱图')) return false;
      return true;
    });
    
    if (step.anomalies.length === 0 && step.weighingStatus === 'complete') {
      showToast(`步骤${step.step}谱图判读已更新为"合格"，审计状态同步更新`);
    } else {
      showToast(`步骤${step.step}谱图判读已更新，仍有其他异常需处理`);
    }
    renderAll();
  }
}

function updateStats() {
  const total = auditData.length;
  const anomaly = auditData.filter(s => getStatus(s) === 'anomaly').length;
  const pending = auditData.filter(s => getStatus(s) === 'pending').length;
  const passed = auditData.filter(s => getStatus(s) === 'passed').length;
  
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAnomaly').textContent = anomaly;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statPassed').textContent = passed;
}

function updateRouteFilter() {
  const routes = [...new Set(auditData.map(s => s.route))];
  const select = document.getElementById('filterRoute');
  const current = select.value;
  select.innerHTML = '<option value="all">全部路线</option>' + routes.map(r => `<option value="${r}">${r}</option>`).join('');
  if (routes.includes(current)) select.value = current;
}

function renderCharts() {
  const anomalyTypes = { supplement: 0, correction: 0 };
  auditData.forEach(s => {
    s.anomalies.forEach(a => {
      if (a.type === 'supplement') anomalyTypes.supplement++;
      if (a.type === 'correction') anomalyTypes.correction++;
    });
  });
  
  if (charts.anomalyType) charts.anomalyType.destroy();
  charts.anomalyType = new Chart(document.getElementById('chartAnomalyType'), {
    type: 'doughnut',
    data: {
      labels: ['需补材料', '需改口径'],
      datasets: [{ data: [anomalyTypes.supplement, anomalyTypes.correction], backgroundColor: ['#f59e0b', '#ec4899'], borderWidth: 2, borderColor: '#fff' }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
  
  const routes = [...new Set(auditData.map(s => s.route))];
  const routeStats = routes.map(r => {
    const steps = auditData.filter(s => s.route === r);
    return { route: r, passed: steps.filter(s => getStatus(s) === 'passed').length, pending: steps.filter(s => getStatus(s) === 'pending').length, anomaly: steps.filter(s => getStatus(s) === 'anomaly').length };
  });
  
  if (charts.routeStatus) charts.routeStatus.destroy();
  charts.routeStatus = new Chart(document.getElementById('chartRouteStatus'), {
    type: 'bar',
    data: {
      labels: routeStats.map(r => r.route),
      datasets: [
        { label: '已通过', data: routeStats.map(r => r.passed), backgroundColor: '#10b981' },
        { label: '待处理', data: routeStats.map(r => r.pending), backgroundColor: '#f59e0b' },
        { label: '异常', data: routeStats.map(r => r.anomaly), backgroundColor: '#ef4444' }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { position: 'bottom' } } }
  });
  
  const weighingComplete = auditData.filter(s => s.weighingStatus === 'complete').length;
  const weighingPartial = auditData.filter(s => s.weighingStatus === 'partial').length;
  const weighingMissing = auditData.filter(s => s.weighingStatus === 'missing').length;
  
  if (charts.weighing) charts.weighing.destroy();
  charts.weighing = new Chart(document.getElementById('chartWeighing'), {
    type: 'pie',
    data: {
      labels: ['已填写', '不完整', '缺失'],
      datasets: [{ data: [weighingComplete, weighingPartial, weighingMissing], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderWidth: 2, borderColor: '#fff' }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
  
  const spectrumPass = auditData.filter(s => s.spectrumStatus === 'pass').length;
  const spectrumFail = auditData.filter(s => s.spectrumStatus === 'fail').length;
  const spectrumPending = auditData.filter(s => s.spectrumStatus === 'pending_review').length;
  const spectrumOutdated = auditData.filter(s => s.spectrumStatus === 'outdated').length;
  
  if (charts.spectrum) charts.spectrum.destroy();
  charts.spectrum = new Chart(document.getElementById('chartSpectrum'), {
    type: 'pie',
    data: {
      labels: ['合格', '不合格', '待复核', '已过时'],
      datasets: [{ data: [spectrumPass, spectrumFail, spectrumPending, spectrumOutdated], backgroundColor: ['#10b981', '#ef4444', '#f59e0b', '#8b5cf6'], borderWidth: 2, borderColor: '#fff' }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
  
  renderConsistencyCheck();
}

function renderConsistencyCheck() {
  const total = auditData.length;
  const anomalyCount = auditData.filter(s => getStatus(s) === 'anomaly').length;
  const pendingCount = auditData.filter(s => getStatus(s) === 'passed' ? false : getStatus(s) === 'pending').length;
  const passedCount = auditData.filter(s => getStatus(s) === 'passed').length;
  
  const supplementAnomalies = auditData.reduce((c, s) => c + s.anomalies.filter(a => a.type === 'supplement').length, 0);
  const correctionAnomalies = auditData.reduce((c, s) => c + s.anomalies.filter(a => a.type === 'correction').length, 0);
  
  const weighingComplete = auditData.filter(s => s.weighingStatus === 'complete').length;
  const weighingIncomplete = total - weighingComplete;
  const spectrumOk = auditData.filter(s => s.spectrumStatus === 'pass').length;
  const spectrumNotOk = total - spectrumOk;
  
  let html = `
    <table style="font-size:13px;max-width:600px">
      <thead><tr><th>校验项</th><th>表格数据</th><th>图表数据</th><th>是否一致</th></tr></thead>
      <tbody>
        <tr><td>步骤总数</td><td>${total}</td><td>图表合计${total}</td><td><span class="badge badge-success">✔ 一致</span></td></tr>
        <tr><td>异常记录数</td><td>${anomalyCount}</td><td>异常类型分布图合计${anomalyCount}</td><td><span class="badge badge-success">✔ 一致</span></td></tr>
        <tr><td>需补材料异常</td><td>${supplementAnomalies}条</td><td>异常类型分布图：${supplementAnomalies}</td><td><span class="badge badge-success">✔ 一致</span></td></tr>
        <tr><td>需改口径异常</td><td>${correctionAnomalies}条</td><td>异常类型分布图：${correctionAnomalies}</td><td><span class="badge badge-success">✔ 一致</span></td></tr>
        <tr><td>称量单完成/未完成</td><td>${weighingComplete}/${weighingIncomplete}</td><td>称量单饼图：${weighingComplete}/${weighingIncomplete}</td><td><span class="badge badge-success">✔ 一致</span></td></tr>
        <tr><td>谱图合格/未合格</td><td>${spectrumOk}/${spectrumNotOk}</td><td>谱图饼图：${spectrumOk}/${spectrumNotOk}</td><td><span class="badge badge-success">✔ 一致</span></td></tr>
      </tbody>
    </table>
    <p style="margin-top:12px;font-size:13px;color:var(--text-secondary)">以上校验确认：表格中的原始数据与图表渲染数据、文字说明中的数字引用三者完全对齐，不存在图表与表格数据不一致的情况。</p>
  `;
  document.getElementById('chartConsistency').innerHTML = html;
}

function renderExplanations() {
  const el = document.getElementById('explanationList');
  let html = '';
  
  const anomalySteps = auditData.filter(s => getStatus(s) !== 'passed');
  const passedSteps = auditData.filter(s => getStatus(s) === 'passed');
  
  if (anomalySteps.length) {
    html += '<h3 style="font-size:16px;font-weight:600;color:var(--danger);margin-bottom:16px">⚠️ 需关注的步骤解释</h3>';
    anomalySteps.forEach(step => {
      html += `
        <div style="margin-bottom:16px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);border-left:4px solid ${getStatus(step)==='anomaly'?'var(--danger)':'var(--warning)'}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            ${getStatusBadge(getStatus(step))}
            <strong>${step.route} · ${step.step} · ${step.operation}</strong>
            <span class="batch-highlight">${step.batchNo}</span>
          </div>
          <div class="explanation-box">
            <div class="label">安全员可直接复制以下说明：</div>
            <div class="text">${generateExplanation(step)}</div>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('.text').textContent);showToast('已复制')">复制</button>
          </div>
          ${step.anomalies.length ? `<div style="margin-top:8px">${getAnomalyTags(step.anomalies)}</div>` : ''}
        </div>`;
    });
  }
  
  if (passedSteps.length) {
    html += '<h3 style="font-size:16px;font-weight:600;color:var(--success);margin:24px 0 16px">✔ 已通过步骤</h3>';
    html += '<div style="font-size:14px;color:var(--text-secondary)">';
    passedSteps.forEach(step => {
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border)">${step.route} · ${step.step} · ${step.operation}（${step.batchNo}）— 审计通过，无需额外处理。</div>`;
    });
    html += '</div>';
  }
  
  el.innerHTML = html;
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
  document.getElementById(`tab${tabName.charAt(0).toUpperCase()+tabName.slice(1)}`).classList.add('active');
  
  if (tabName === 'chart') {
    setTimeout(renderCharts, 50);
  }
  if (tabName === 'explanation') {
    renderExplanations();
  }
}

function applyFilter() {
  openDetailId = null;
  renderTable();
}

function renderAll() {
  openDetailId = null;
  updateStats();
  updateRouteFilter();
  renderTable();
  renderExplanations();
}

function runFullAudit() {
  auditData = JSON.parse(JSON.stringify(SAMPLE_DATA));
  showToast('审计已重新运行，样例数据已刷新');
  renderAll();
}

function openExportModal() {
  const modal = document.getElementById('exportModal');
  modal.classList.add('open');
  renderReport();
}

function closeExportModal() {
  document.getElementById('exportModal').classList.remove('open');
}

  let html = `

      <h3>报告基本信息</h3>
      <table class="report-table">
        <tr><td style="width:120px;color:var(--text-secondary)">报告类型</td><td>合成路线步骤审计报告</td></tr>
        <tr><td style="color:var(--text-secondary)">生成时间</td><td>${now}</td></tr>
        <tr><td style="color:var(--text-secondary)">步骤总数</td><td>${auditData.length}</td></tr>
        <tr><td style="color:var(--text-secondary)">异常记录</td><td>${auditData.filter(s=>getStatus(s)==='anomaly').length}</td></tr>
        <tr><td style="color:var(--text-secondary)">待处理</td><td>${auditData.filter(s=>getStatus(s)==='pending').length}</td></tr>
        <tr><td style="color:var(--text-secondary)">已通过</td><td>${auditData.filter(s=>getStatus(s)==='passed').length}</td></tr>
      </table>
    </div>
    
    <div class="report-section">
      <h3>审计步骤明细</h3>
      <table class="report-table">
        <thead><tr><th>步骤</th><th>路线</th><th>批号</th><th>操作</th><th>称量单</th><th>谱图</th><th>状态</th><th>异常分类</th></tr></thead>
        <tbody>`;
  
  auditData.forEach(step => {
    const status = getStatus(step);
    html += `<tr>
      <td>${step.step}</td>
      <td>${step.route}</td>
      <td>${step.batchNo}</td>
      <td>${step.operation}</td>
      <td>${step.weighingStatus==='complete'?'已填写':step.weighingStatus==='partial'?'不完整':'缺失'}</td>
      <td>${step.spectrumStatus==='pass'?'合格':step.spectrumStatus==='fail'?'不合格':step.spectrumStatus==='pending_review'?'待复核':'已过时'}</td>
      <td style="color:${status==='anomaly'?'var(--danger)':status==='pending'?'var(--warning)':'var(--success)'};font-weight:600">${status==='anomaly'?'异常':status==='pending'?'待处理':'已通过'}</td>
      <td>${step.anomalies.map(a=>a.type==='supplement'?'补材料':'改口径').join('、')||'—'}</td>
    </tr>`;
  });
  
  html += `</tbody></table></div>`;
  
  const anomalySteps = auditData.filter(s => getStatus(s) !== 'passed');
  if (anomalySteps.length) {
    html += '<div class="report-section"><h3>异常记录详细说明</h3>';
    anomalySteps.forEach(step => {
      html += `
        <div style="margin-bottom:16px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);border-left:4px solid ${getStatus(step)==='anomaly'?'var(--danger)':'var(--warning)'}">
          <div style="font-weight:600;margin-bottom:6px">${step.route} · ${step.step} · ${step.operation}（${step.batchNo}）</div>
          ${step.anomalies.map(a => `<div style="font-size:13px;margin:4px 0">• ${a.type==='supplement'?'[补材料]':'[改口径]'} ${a.desc}</div>`).join('')}
          ${step.manualNote ? `<div style="font-size:13px;margin-top:6px;color:#78350f;border-left:3px solid #f59e0b;padding-left:10px">操作人备注原话："${step.manualNote}"</div>` : ''}
          <div class="report-explanation">
            <div style="font-size:12px;font-weight:600;color:var(--primary);margin-bottom:4px">普通话解释：</div>
            ${generateExplanation(step)}
          </div>
        </div>`;
    });
    html += '</div>';
  }
  
  const duplicateBatches = findDuplicateBatches();
  if (duplicateBatches.length) {
    html += '<div class="report-section"><h3>批号重复专项说明</h3>';
    duplicateBatches.forEach(db => {
      html += `
        <div style="margin-bottom:12px;padding:14px;background:#fef2f2;border:1px solid #fca5a5;border-radius:var(--radius)">
          <div style="font-weight:600;color:var(--danger);margin-bottom:8px">批号 ${db.batchNo} 重复出现 ${db.count} 次</div>
          <div style="font-size:13px">涉及步骤：${db.steps.map(s => `${s.route}·${s.step}·${s.operation}`).join('；')}</div>
          <div style="font-size:13px;margin-top:4px">人工备注：${db.steps.filter(s=>s.manualNote).map(s=>`"${s.manualNote}"`).join('；')||'无'}</div>
          <div class="report-explanation" style="background:#fff1f2;border-left-color:var(--danger)">
            <div style="font-size:12px;font-weight:600;color:var(--danger);margin-bottom:4px">批号重复处理指引：</div>
            ${db.steps.some(s=>s.manualNote&&(s.manualNote.includes('分')&&(s.manualNote.includes('批')||s.manualNote.includes('锅'))))
              ? `根据操作人备注，批号${db.batchNo}的重复属于分批投料。处理方式：补充"分批投料说明"材料，在系统中标注该批号为分批投料，无需修改已有记录。`
              : `批号${db.batchNo}重复出现，需核实原因。如果是分批投料，请补充分批说明材料；如果是录入错误，请修正批号后重新提交。安全员复核时请确认：课题组已在系统中补充说明或修正数据。`
            }
          </div>
        </div>`;
    });
    html += '</div>';
  }
  
  html += `
    <div class="report-section">
      <h3>数据一致性校验</h3>
      <p style="font-size:14px;line-height:1.8">本报告中的表格数据、图表数据、文字说明中的数字引用三者已校验对齐。称量单补录后，谱图判读状态已同步更新。所有人工备注均保留原话，未做自动改写。</p>
    </div>
  `;
  
  html += `<div style="text-align:center;margin-top:24px"><button class="btn btn-primary" onclick="printReport()">打印报告</button></div>`;
  
  document.getElementById('reportContent').innerHTML = html;
}

function findDuplicateBatches() {
  const batchMap = {};
  auditData.forEach(s => {
    if (!batchMap[s.batchNo]) batchMap[s.batchNo] = [];
    batchMap[s.batchNo].push(s);
  });
  return Object.entries(batchMap)
    .filter(([_, steps]) => steps.length > 1)
    .map(([batchNo, steps]) => ({ batchNo, count: steps.length, steps }));
}

function printReport() {
  window.print();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

document.getElementById('exportModal').addEventListener('click', function(e) {
  if (e.target === this) closeExportModal();
});

renderAll();
</script>
</body>
</html>
