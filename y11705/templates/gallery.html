<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品展示 - 分形图案生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f23; color: #e0e0e0; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #333; margin-bottom: 30px; }
        h1 { font-size: 2.5em; background: linear-gradient(90deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
        .nav-btn { padding: 12px 30px; background: #1a1a2e; border: 1px solid #333; border-radius: 6px; color: #aaa; text-decoration: none; font-size: 1em; transition: all 0.2s; }
        .nav-btn:hover { background: #252545; color: #667eea; border-color: #667eea; }
        .nav-btn.active { background: linear-gradient(90deg, #667eea, #764ba2); color: white; border-color: transparent; }
        .filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-label { color: #888; }
        select { padding: 8px 12px; background: #1a1a2e; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { background: #1a1a2e; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a4e; transition: transform 0.2s, box-shadow 0.2s; }
        .gallery-item:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2); }
        .gallery-image { width: 100%; height: 200px; object-fit: cover; background: #0f0f23; }
        .gallery-info { padding: 15px; }
        .gallery-title { font-weight: 600; margin-bottom: 5px; color: #667eea; }
        .gallery-meta { font-size: 0.85em; color: #888; }
        .gallery-note { font-size: 0.9em; color: #aaa; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .loading { text-align: center; padding: 40px; }
        .spinner { border: 3px solid #333; border-top: 3px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; margin-right: 5px; }
        .badge.manual { background: rgba(102, 126, 234, 0.2); color: #667eea; }
        .badge.preset { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .badge.revision { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>作品展示</h1>
        </header>

        <div class="nav-buttons">
            <a href="/" class="nav-btn">生成器</a>
            <a href="/gallery" class="nav-btn active">作品展示</a>
        </div>

        <div class="filters">
            <span class="filter-label">筛选:</span>
            <select id="type-filter">
                <option value="">全部分形</option>
                <option value="mandelbrot">Mandelbrot</option>
                <option value="julia">Julia</option>
                <option value="sierpinski">Sierpinski</option>
                <option value="burning_ship">燃烧船</option>
            </select>
        </div>

        <div id="gallery-grid" class="gallery-grid"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            还没有作品，去<a href="/" style="color: #667eea;">生成器</a>创建你的第一个分形吧！
        </div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>

    <script>
        async function loadRecords(fractalType = '') {
            const grid = document.getElementById('gallery-grid');
            const empty = document.getElementById('empty-state');
            const loading = document.getElementById('loading');

            grid.innerHTML = '';
            empty.style.display = 'none';
            loading.style.display = 'block';

            try {
                const url = fractalType ? `/api/records?fractal_type=${fractalType}` : '/api/records';
                const response = await fetch(url);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.records.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                const sourceLabels = {
                    'manual': '手动',
                    'preset': '预设',
                    'revision': '修订',
                };

                data.records.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.innerHTML = `
                        <a href="/record/${record.id}" style="text-decoration: none; color: inherit;">
                            ${record.image_path ? `<img class="gallery-image" src="${record.image_url}" alt="分形图案">` : '<div class="gallery-image" style="display: flex; align-items: center; justify-content: center; color: #666;">无图像</div>'}
                            <div class="gallery-info">
                                <div class="gallery-title">${record.fractal_type}</div>
                                <div class="gallery-meta">
                                    <span class="badge ${record.source}">${sourceLabels[record.source] || record.source}</span>
                                    ${record.color_scheme} · ${record.width}x${record.height}
                                </div>
                                ${record.student_note ? `<div class="gallery-note">${record.student_note}</div>` : ''}
                            </div>
                        </a>
                    `;
                    grid.appendChild(item);
                });
            } catch (error) {
                loading.style.display = 'none';
                empty.style.display = 'block';
                empty.textContent = '加载失败: ' + error.message;
            }
        }

        document.getElementById('type-filter').addEventListener('change', (e) => {
            loadRecords(e.target.value);
        });

        loadRecords();
    </script>
</body>
</html>
