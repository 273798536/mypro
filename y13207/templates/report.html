{% extends "base.html" %}

{% block title %}报告 - {{ session.name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2><i class="bi bi-file-earmark-text"></i> 归档报告</h2>
        <p class="text-muted mb-0">{{ session.name }}</p>
    </div>
    <div>
        <a href="{{ url_for('download_report', session_id=session.id) }}" class="btn btn-success me-2">
            <i class="bi bi-download"></i> 下载 Markdown
        </a>
        <a href="{{ url_for('export_csv', session_id=session.id) }}" class="btn btn-outline-success me-2">
            <i class="bi bi-file-spreadsheet"></i> 导出 CSV
        </a>
        <a href="{{ url_for('session_detail', session_id=session.id) }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 返回详情
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div id="reportContent" class="markdown-body">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3 text-muted">正在渲染报告...</p>
            </div>
        </div>
    </div>
</div>

<textarea id="rawMarkdown" style="display: none;">{{ report_content }}</textarea>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
.markdown-body h1 { font-size: 1.8rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; margin-top: 0; }
.markdown-body h2 { font-size: 1.4rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3rem; margin-top: 1.5rem; }
.markdown-body h3 { font-size: 1.1rem; margin-top: 1rem; }
.markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
.markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; }
.markdown-body th { background: #f9fafb; font-weight: 600; }
.markdown-body blockquote {
    border-left: 4px solid #3b82f6;
    padding-left: 1rem;
    color: #4b5563;
    margin: 1rem 0;
    background: #f0f7ff;
    padding: 0.75rem 1rem;
    border-radius: 0 4px 4px 0;
}
.markdown-body code {
    background: #f3f4f6;
    padding: 0.125rem 0.375rem;
    border-radius: 3px;
    font-size: 0.9em;
}
.markdown-body hr { border-color: #e5e7eb; margin: 1.5rem 0; }
.markdown-body ul, .markdown-body ol { padding-left: 1.5rem; }
.markdown-body li { margin: 0.25rem 0; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const rawMarkdown = document.getElementById('rawMarkdown').value;
    const reportContent = document.getElementById('reportContent');

    if (typeof marked !== 'undefined') {
        reportContent.innerHTML = marked.parse(rawMarkdown);
    } else {
        reportContent.innerHTML = '<pre>' + rawMarkdown + '</pre>';
    }
});
</script>
{% endblock %}
