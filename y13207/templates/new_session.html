{% extends "base.html" %}

{% block title %}新建归档 - 录音棚时码清单归档{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> 新建归档</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">归档名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="例如：2024春季音乐会时码清单" required>
                        <div class="form-text">给这份归档起个名字，方便以后查找</div>
                    </div>
                    <div class="mb-4">
                        <label for="description" class="form-label">描述（可选）</label>
                        <textarea class="form-control" id="description" name="description" rows="3"
                                  placeholder="补充说明这场演出的背景信息..."></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 创建归档
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-lightbulb"></i> 小提示</h5>
            </div>
            <div class="card-body">
                <ul class="mb-0">
                    <li>支持上传的文件格式：CSV、Excel (.xlsx/.xls)、文本 (.txt/.md)</li>
                    <li>系统会自动识别文件类型：舞台通道表、曲目表、时码清单、备注</li>
                    <li>文件名带"旧版"、"备份"等字样的会自动标记为旧版数据</li>
                    <li>所有数据保存在本地，服务重启后仍然存在</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
