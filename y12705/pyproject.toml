[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-prior-sensitivity"
version = "0.1.0"
description = "贝叶斯先验敏感性分析工具 - 面向算法工程师和投委会的边界样例批量复核系统"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "rich>=13.0.0",
]

[project.scripts]
bps = "bayesian_prior_sensitivity.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bayesian_prior_sensitivity*"]
