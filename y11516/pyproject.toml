[project]
name = "water-repair-inspect"
version = "0.1.0"
description = "水务抢修材料多源导入巡检工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
]

[project.scripts]
wri = "water_repair_inspect.cli:main"

[tool.setuptools.packages.find]
where = ["."]
