<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(135deg, #1a3a5c 0%, #2d5a87 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }
        .header .subtitle {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .nav {
            background: white;
            padding: 0 30px;
            border-bottom: 1px solid #e4e7ed;
            display: flex;
            gap: 5px;
        }
        .nav a {
            padding: 14px 18px;
            text-decoration: none;
            color: #606266;
            font-size: 14px;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .nav a:hover, .nav a.active {
            color: #2d5a87;
            border-bottom-color: #2d5a87;
            background: #f0f7ff;
        }
        .container {
            max-width: 1280px;
            margin: 24px auto;
            padding: 0 24px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ebeef5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            font-weight: 500;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .summary-item {
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            color: white;
        }
        .summary-item .num {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
        }
        .summary-item .label {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            color: #606266;
            font-size: 12px;
        }
        tr:hover {
            background: #f5f7fa;
        }
        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        .filter-bar input:focus, .filter-bar select:focus {
            border-color: #2d5a87;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #2d5a87;
            color: white;
        }
        .btn-primary:hover {
            background: #1a3a5c;
        }
        .btn-outline {
            background: white;
            color: #606266;
            border: 1px solid #dcdfe6;
        }
        .btn-outline:hover {
            color: #2d5a87;
            border-color: #2d5a87;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .detail-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px dashed #ebeef5;
            font-size: 13px;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #909399;
        }
        .detail-value {
            color: #303133;
        }
        .trace-chain {
            position: relative;
            padding-left: 24px;
        }
        .trace-node {
            position: relative;
            padding: 12px 16px;
            background: #f5f7fa;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #2d5a87;
        }
        .trace-node:before {
            content: '';
            position: absolute;
            left: -22px;
            top: 16px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2d5a87;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #2d5a87;
        }
        .trace-node h4 {
            font-size: 14px;
            color: #303133;
            margin-bottom: 6px;
        }
        .trace-node .meta {
            font-size: 12px;
            color: #909399;
            margin-bottom: 8px;
        }
        .trace-node .content {
            font-size: 13px;
            color: #606266;
        }
        .review-form {
            display: grid;
            gap: 12px;
        }
        .review-form label {
            font-size: 13px;
            color: #606266;
            font-weight: 500;
        }
        .review-form input, .review-form select, .review-form textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        .review-form textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .alert-info {
            background: #ecf5ff;
            color: #2d5a87;
            border: 1px solid #d9ecff;
        }
        .alert-warning {
            background: #fdf6ec;
            color: #e6a23c;
            border: 1px solid #faecd8;
        }
        .alert-danger {
            background: #fef0f0;
            color: #f56c6c;
            border: 1px solid #fde2e2;
        }
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .two-column { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #909399;
            font-size: 13px;
        }
        .link-btn {
            background: none;
            border: none;
            color: #2d5a87;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-size: 13px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="header">
        <h1>🚢 {{ app_name }}</h1>
        <div class="subtitle">样品可追溯 · 颜色清晰 · 复核留痕</div>
    </div>
    <nav class="nav">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">样品箱总览</a>
        <a href="{{ url_for('export_page') }}" class="{% if request.endpoint == 'export_page' %}active{% endif %}">报告导出</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
