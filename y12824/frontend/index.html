<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水产苗种存活率管理系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">水产苗种存活率管理系统</a>
                <div class="navbar-nav">
                    <button v-for="tab in tabs" :key="tab.key" 
                            class="nav-link btn" 
                            :class="{ 'active': currentTab === tab.key }"
                            @click="currentTab = tab.key">
                        {{ tab.name }}
                        <span v-if="tab.key === 'list' && duplicateCount > 0" class="badge bg-danger ms-1">{{ duplicateCount }}</span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <import-view v-if="currentTab === 'import'" @imported="onDataImported"></import-view>
            <list-view v-if="currentTab === 'list'" 
                       @view-detail="viewDetail" 
                       @review="goReview"
                       @update-duplicate="updateDuplicateCount"></list-view>
            <detail-view v-if="currentTab === 'detail'" :sample-id="selectedSampleId" @back="currentTab = 'list'"></detail-view>
            <review-view v-if="currentTab === 'review'" @back="currentTab = 'list'"></review-view>
            <report-view v-if="currentTab === 'report'"></report-view>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
