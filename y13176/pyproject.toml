[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-speckle-warning"
version = "0.1.0"
description = "激光散斑阈值预警处理链 - 支持材料追踪、采样缺口检测、参数版本管理和结构化输出"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.scripts]
laser-speckle-warning = "laser_speckle_warning.cli:main"

[tool.setuptools.packages.find]
where = ["."]
