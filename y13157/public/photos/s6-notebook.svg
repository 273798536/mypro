<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="制热量与COP计算手稿">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="paper6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg6)"/>
  <!-- notebook -->
  <g transform="rotate(-3 200 150)">
    <rect x="60" y="50" width="280" height="200" rx="6" fill="url(#paper6)" stroke="#94a3b8"/>
    <!-- spiral binding -->
    <line x1="60" y1="50" x2="60" y2="250" stroke="#475569" stroke-width="2"/>
    <g fill="#475569">
      <circle cx="60" cy="70" r="3"/><circle cx="60" cy="100" r="3"/><circle cx="60" cy="130" r="3"/>
      <circle cx="60" cy="160" r="3"/><circle cx="60" cy="190" r="3"/><circle cx="60" cy="220" r="3"/>
    </g>
    <!-- ruled lines -->
    <g stroke="#bfdbfe" stroke-width="0.8">
      <line x1="80" y1="95" x2="320" y2="95"/><line x1="80" y1="115" x2="320" y2="115"/>
      <line x1="80" y1="135" x2="320" y2="135"/><line x1="80" y1="155" x2="320" y2="155"/>
      <line x1="80" y1="175" x2="320" y2="175"/><line x1="80" y1="195" x2="320" y2="195"/>
      <line x1="80" y1="215" x2="320" y2="215"/>
    </g>
    <!-- handwritten formula -->
    <g font-family="'Comic Sans MS', cursive" fill="#1e3a8a">
      <text x="84" y="90" font-size="15" font-weight="700">制热量 Q = c·m·Δt</text>
      <text x="84" y="112" font-size="13">= 4.18 × (2.4/60) × 60 × 30</text>
      <text x="84" y="134" font-size="13">≈ 72 kW</text>
      <text x="84" y="158" font-size="15" font-weight="700" fill="#b91c1c">COP = Q / P = 72 / 17.2</text>
      <text x="84" y="180" font-size="16" font-weight="700" fill="#15803d">COP = 4.2</text>
    </g>
    <text x="250" y="218" font-family="cursive" font-size="11" fill="#475569">阿岑 · 0613</text>
    <!-- coffee stain -->
    <g opacity="0.5">
      <ellipse cx="300" cy="100" rx="26" ry="18" fill="#92400e" opacity="0.35"/>
      <ellipse cx="300" cy="100" rx="18" ry="12" fill="none" stroke="#78350f" stroke-width="3"/>
    </g>
  </g>
  <!-- pen -->
  <g transform="rotate(35 320 250)">
    <rect x="270" y="246" width="90" height="8" rx="2" fill="#1d4ed8"/>
    <rect x="356" y="244" width="14" height="12" fill="#1e293b"/>
    <polygon points="270,246 258,250 270,254" fill="#334155"/>
  </g>
  <!-- calculator -->
  <g transform="translate(300,210)">
    <rect x="0" y="0" width="70" height="60" rx="4" fill="#334155" stroke="#1e293b"/>
    <rect x="6" y="6" width="58" height="16" fill="#051108"/>
    <text x="60" y="19" text-anchor="end" font-family="monospace" font-size="11" fill="#22c55e">4.2</text>
    <g fill="#475569">
      <rect x="6" y="28" width="12" height="9" rx="1"/><rect x="22" y="28" width="12" height="9" rx="1"/>
      <rect x="38" y="28" width="12" height="9" rx="1"/><rect x="54" y="28" width="12" height="9" rx="1"/>
      <rect x="6" y="40" width="12" height="9" rx="1"/><rect x="22" y="40" width="12" height="9" rx="1"/>
      <rect x="38" y="40" width="12" height="9" rx="1"/><rect x="54" y="40" width="12" height="9" rx="1"/>
    </g>
  </g>
  <text x="20" y="270" fill="#64748b" font-family="monospace" font-size="11">STEP-06 · 制热量与 COP 计算</text>
  <text x="20" y="286" fill="#475569" font-family="monospace" font-size="9">现场照片 · 收尾计算稿</text>
</svg>
