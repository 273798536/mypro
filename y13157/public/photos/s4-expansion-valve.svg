<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="电子膨胀阀控制界面">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="screen4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a4a"/><stop offset="1" stop-color="#06121f"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)"/>
  <!-- control cabinet -->
  <rect x="70" y="40" width="260" height="220" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <rect x="70" y="40" width="260" height="26" rx="10" fill="#334155"/>
  <text x="200" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">EEV CONTROLLER · 现场柜</text>
  <!-- screen -->
  <rect x="92" y="80" width="216" height="120" rx="6" fill="url(#screen4)" stroke="#1e3a8a"/>
  <rect x="92" y="80" width="216" height="120" rx="6" fill="#3b82f6" opacity="0.05"/>
  <text x="104" y="100" font-family="monospace" font-size="10" fill="#60a5fa">膨胀阀开度</text>
  <text x="280" y="140" text-anchor="end" font-family="monospace" font-size="40" fill="#22d3ee" font-weight="700">48</text>
  <text x="296" y="140" font-family="monospace" font-size="16" fill="#22d3ee">%</text>
  <text x="104" y="150" font-family="monospace" font-size="10" fill="#60a5fa">过热度 SH</text>
  <text x="180" y="150" font-family="monospace" font-size="20" fill="#34d399" font-weight="700">7.8</text>
  <text x="214" y="150" font-family="monospace" font-size="11" fill="#34d399">K</text>
  <!-- progress bar -->
  <rect x="104" y="166" width="192" height="8" rx="4" fill="#0b1220" stroke="#1e3a8a"/>
  <rect x="106" y="168" width="92" height="4" rx="2" fill="#22d3ee"/>
  <text x="104" y="192" font-family="monospace" font-size="9" fill="#475569">MODE: HEAT · STEP ADJUST</text>
  <!-- buttons -->
  <rect x="92" y="212" width="100" height="34" rx="4" fill="#334155" stroke="#475569"/>
  <text x="142" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#e2e8f0">− 下调</text>
  <rect x="200" y="212" width="108" height="34" rx="4" fill="#1d4ed8"/>
  <text x="254" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#dbeafe">＋ 上调</text>
  <circle cx="92" cy="248" r="3" fill="#22c55e"/><circle cx="104" cy="248" r="3" fill="#475569"/>
  <text x="20" y="270" fill="#64748b" font-family="monospace" font-size="11">STEP-04 · 膨胀阀开度调节</text>
  <text x="20" y="286" fill="#475569" font-family="monospace" font-size="9">现场照片 · 控制界面</text>
</svg>
