[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-dedup"
version = "0.1.0"
description = "问答样本去模板化 AI/ML 工作流工具"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
qa-dedup = "qa_dedup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
