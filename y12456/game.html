<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鼓点塔防排练室 - 游戏中</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← 返回关卡选择</a>
  
  <div id="messageContainer" class="message-container"></div>
  
  <div class="game-container">
    <div class="game-main">
      <div class="game-header">
        <div class="level-info">
          <h1 id="levelName">加载中...</h1>
          <div class="level-meta">
            <span id="difficulty"></span>
            <span id="levelVersion"></span>
            <span id="levelSource"></span>
          </div>
          <div class="level-meta">
            <span class="track-name" id="trackName"></span>
            <span id="trackVersion"></span>
            <span id="trackSource"></span>
          </div>
        </div>
        
        <div class="game-stats">
          <div class="stat">
            <div class="stat-label">得分</div>
            <div class="stat-value score" id="score">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">金币</div>
            <div class="stat-value gold" id="gold">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">生命</div>
            <div class="stat-value lives" id="lives">10</div>
          </div>
          <div class="stat">
            <div class="stat-label">波次</div>
            <div class="stat-value" id="wave">0/3</div>
          </div>
          <div class="stat">
            <div class="stat-label">时间</div>
            <div class="stat-value" id="gameTime">0:00</div>
          </div>
          <div class="stat">
            <div class="stat-label">状态</div>
            <div class="stat-value" id="gameStatus">准备</div>
          </div>
        </div>
        
        <div class="bpm-display">
          <button id="bpmDown" title="降低BPM">-</button>
          <div>
            <div class="bpm-value" id="currentBpm">80.0</div>
            <div class="bpm-target">目标: <span id="targetBpm">80</span></div>
          </div>
          <button id="bpmUp" title="提高BPM">+</button>
          <span id="driftWarning" title="速度漂移次数">⚠️ <span id="driftCount">0</span></span>
        </div>
      </div>
      
      <div class="game-controls">
        <button id="startBtn" class="btn btn-primary">▶ 开始</button>
        <button id="pauseBtn" class="btn btn-secondary" disabled>⏸ 暂停</button>
        <button id="restartBtn" class="btn btn-outline">🔄 重新开始</button>
        <button id="historyBtn" class="btn btn-outline">📊 历史记录</button>
        <div class="speed-presets">
          <button class="speed-preset" data-bpm="60">60</button>
          <button class="speed-preset" data-bpm="80">80</button>
          <button class="speed-preset" data-bpm="100">100</button>
          <button class="speed-preset" data-bpm="120">120</button>
        </div>
      </div>
      
      <div class="game-canvas-wrapper">
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
      </div>
    </div>
    
    <div class="game-sidebar">
      <div class="sidebar-section">
        <h3>🎯 训练目标</h3>
        <div id="objectives"></div>
        <p id="levelDesc" style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 10px; line-height: 1.5;"></p>
      </div>
      
      <div class="sidebar-section">
        <h3>🏗️ 建造塔</h3>
        <div id="towerPanel"></div>
      </div>
      
      <div class="sidebar-section" id="selectedTowerPanel" style="display: none;">
        <h3>🔧 塔信息</h3>
        <h4 id="selectedTowerName" style="margin-bottom: 5px;"></h4>
        <div id="selectedTowerLevel" style="color: #FFD700; font-size: 13px; margin-bottom: 10px;"></div>
        <div class="tower-stats">
          <div class="tower-stat">
            <span class="tower-stat-label">伤害</span>
            <span class="tower-stat-value" id="selectedTowerDamage"></span>
          </div>
          <div class="tower-stat">
            <span class="tower-stat-label">范围</span>
            <span class="tower-stat-value" id="selectedTowerRange"></span>
          </div>
          <div class="tower-stat">
            <span class="tower-stat-label">击杀</span>
            <span class="tower-stat-value" id="selectedTowerKills"></span>
          </div>
          <div class="tower-stat">
            <span class="tower-stat-label">总伤害</span>
            <span class="tower-stat-value" id="selectedTowerDamageDealt"></span>
          </div>
        </div>
        <div class="tower-actions">
          <button id="upgradeTowerBtn" class="btn btn-secondary">升级</button>
          <button id="sellTowerBtn" class="btn btn-outline">出售</button>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>📖 操作说明</h3>
        <div class="track-info">
          <p>• 点击左侧塔卡片选择要建造的塔</p>
          <p>• 点击地图空白处放置塔</p>
          <p>• 点击已放置的塔可以升级或出售</p>
          <p>• 右键取消选择</p>
          <p>• 守住节拍，消灭节拍怪！</p>
        </div>
      </div>
    </div>
  </div>
  
  <div id="settlementPanel" class="panel-overlay">
    <div class="panel">
      <button class="panel-close" id="closeSettlement">×</button>
      <div id="settlementContent"></div>
    </div>
  </div>
  
  <div id="historyPanel" class="panel-overlay">
    <div class="panel">
      <button class="panel-close" id="closeHistory">×</button>
      <h2 style="margin-bottom: 20px;">📊 历史记录</h2>
      <div id="historyContent"></div>
      <div class="history-actions">
        <button id="exportCSV" class="btn btn-secondary">📥 导出CSV</button>
        <button id="exportScoreCard" class="btn btn-primary">📋 导出最新评分表</button>
      </div>
    </div>
  </div>
  
  <script src="js/config.js"></script>
  <script src="js/data/levels.js"></script>
  <script src="js/engine/GameEngine.js"></script>
  <script src="js/engine/HistoryManager.js"></script>
  <script src="js/ui/GameRenderer.js"></script>
  <script src="js/ui/UIManager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
