replay:
  stable_param_names:
    - SMOKE_LINE_VELOCITY
    - SMOKE_LINE_DENSITY
    - WIND_TUNNEL_PRESSURE
    - WIND_TUNNEL_TEMPERATURE
    - SAFETY_THRESHOLD_VELOCITY
    - SAFETY_THRESHOLD_PRESSURE
  require_all_params: true
  output_dir: outputs

thresholds:
  SAFETY_THRESHOLD_VELOCITY: 120.0
  SAFETY_THRESHOLD_PRESSURE: 350.0
  VELOCITY_TOLERANCE_PCT: 5.0
  PRESSURE_TOLERANCE_PCT: 3.0

parser:
  log_version_new_prefix: "[V2]"
  log_version_old_prefix: "[V1]"
  withdraw_prefix: "[WITHDRAW]"
  remark_prefixes:
    - "[REMARK]"
    - "#"
    - "NOTE:"
  ts_formats:
    - "%Y-%m-%d %H:%M:%S"
    - "%Y/%m/%d %H:%M:%S"
    - "%Y-%m-%dT%H:%M:%S"

anomaly:
  detect_threshold_tamper: true
  isolate_bad_data: true
  min_consecutive_valid: 3
