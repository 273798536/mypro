[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-finance"
version = "1.0.0"
description = "供应链金融发票融资额度占用工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
invoice-finance = "invoice_finance.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
