[project]
name = "feature-lineage-tracker"
version = "0.1.0"
description = "特征血缘任务追踪系统 - Feature Lineage Task Tracking"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pandas>=2.0.0",
]

[project.scripts]
feature-lineage = "feature_lineage.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
