{% extends 'base.html' %}

{% block title %}图表分析 - 充电站分时电价收益分析系统{% endblock %}

{% block extra_css %}
<style>
    .chart-card {
        min-height: 400px;
    }
</style>
{% endblock %}

{% block content %}
<div class="mb-4">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-1">
                <i class="bi bi-bar-chart me-2"></i>
                图表分析
            </h4>
            <small class="text-muted">
                <i class="bi bi-file-earmark-excel me-1"></i>
                {{ filename }}
            </small>
        </div>
        <div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary me-2">
                <i class="bi bi-arrow-left me-2"></i>返回仪表板
            </a>
            <a href="{{ url_for('download_report') }}" class="btn btn-primary">
                <i class="bi bi-download me-2"></i>导出报告
            </a>
        </div>
    </div>
</div>

<div id="chartsContent">
    <div class="text-center py-5">
        <div class="loading mb-3"></div>
        <p class="text-muted">正在加载图表数据...</p>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let charts = {};

document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/charts_data')
        .then(response => response.json())
        .then(data => {
            renderCharts(data);
        })
        .catch(error => {
            document.getElementById('chartsContent').innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    加载图表数据失败：${error}
                </div>
            `;
        });
});

function renderCharts(data) {
    const chartsContent = document.getElementById('chartsContent');
    
    let html = `
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card chart-card">
                <div class="card-header bg-white">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-pie-chart text-primary me-2"></i>
                        收益构成分析
                    </h6>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card chart-card">
                <div class="card-header bg-white">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-bar-chart text-success me-2"></i>
                        各时段充电量分布
                    </h6>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="periodEnergyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card chart-card">
                <div class="card-header bg-white">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-bar-chart text-warning me-2"></i>
                        各时段电费分布
                    </h6>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="periodFeeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card chart-card">
                <div class="card-header bg-white">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-exclamation-triangle text-danger me-2"></i>
                        异常类型分布
                    </h6>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="anomalyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row g-3">
        <div class="col-md-6 offset-md-3">
            <div class="card chart-card">
                <div class="card-header bg-white">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-pc-display text-info me-2"></i>
                        设备状态统计
                    </h6>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="deviceStatusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    `;
    
    chartsContent.innerHTML = html;
    
    setTimeout(() => {
        createPieChart('revenueChart', data.revenue, '¥');
        createBarChart('periodEnergyChart', data.period_energy, '度');
        createBarChart('periodFeeChart', data.period_fee, '元');
        createBarChart('anomalyChart', data.anomalies, '笔', true);
        createPieChart('deviceStatusChart', data.device_status, '笔');
    }, 100);
}

function createPieChart(canvasId, data, unit) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    
    if (charts[canvasId]) {
        charts[canvasId].destroy();
    }
    
    const total = data.values.reduce((a, b) => a + b, 0);
    
    charts[canvasId] = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: data.labels,
            datasets: [{
                data: data.values,
                backgroundColor: data.colors,
                borderColor: '#ffffff',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        padding: 15,
                        font: {
                            size: 12
                        }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const value = context.parsed;
                            const percentage = ((value / total) * 100).toFixed(1);
                            return `${context.label}: ${unit}${value.toFixed(2)} (${percentage}%)`;
                        }
                    }
                }
            }
        }
    });
}

function createBarChart(canvasId, data, unit, horizontal = false) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    
    if (charts[canvasId]) {
        charts[canvasId].destroy();
    }
    
    charts[canvasId] = new Chart(ctx, {
        type: horizontal ? 'bar' : 'bar',
        data: {
            labels: data.labels,
            datasets: [{
                label: '',
                data: data.values,
                backgroundColor: data.colors,
                borderRadius: 6
            }]
        },
        options: {
            indexAxis: horizontal ? 'y' : 'x',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${unit}${context.parsed.y !== undefined ? context.parsed.y.toFixed(2) : context.parsed.x.toFixed(2)}`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    beginAtZero: true,
                    grid: {
                        display: false
                    }
                },
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(0,0,0,0.05)'
                    }
                }
            }
        }
    });
}
</script>
{% endblock %}
