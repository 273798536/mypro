[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slippage-audit"
version = "0.1.0"
description = "量化回测滑点审计CLI工具 - 审计手续费、滑点、停牌等回测细节"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Quant Audit Team" }]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
slippage-audit = "slippage_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
