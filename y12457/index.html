<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮力潜水考古队 - 物理模拟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🚢 浮力潜水考古队</h1>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">当前深度</span>
                    <span class="stat-value" id="depth-display">0</span>
                    <span class="stat-unit">米</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" id="oxygen-label">氧气含量</span>
                    <span class="stat-value" id="oxygen-display">100</span>
                    <span class="stat-unit">%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">当前得分</span>
                    <span class="stat-value" id="score-display">0</span>
                    <span class="stat-unit">分</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">打捞文物</span>
                    <span class="stat-value" id="artifact-count">0</span>
                    <span class="stat-unit">件</span>
                </div>
            </div>
        </header>

        <main class="game-main">
            <section class="ocean-view">
                <div class="water-layer" id="water-layer">
                    <div class="density-indicator" id="density-indicator">
                        <span class="density-label">海水密度</span>
                        <span class="density-value" id="density-value">1.025</span>
                        <span class="density-unit">g/cm³</span>
                    </div>
                    <div class="submarine" id="submarine">
                        <div class="submarine-body">
                            <div class="hatch">舱口</div>
                            <div class="window">◉</div>
                            <div class="propeller">螺旋桨</div>
                        </div>
                        <div class="ballast-tanks">
                            <div class="tank" id="tank-left">
                                <div class="tank-label">左压载舱</div>
                                <div class="tank-fill" id="tank-left-fill"></div>
                                <div class="tank-water" id="tank-left-water"></div>
                                <div class="tank-status" id="tank-left-status">正常</div>
                                <input type="number" id="tank-left-input" class="tank-input" placeholder="注水值 0-100" min="0" max="100">
                                <div class="tank-note" id="tank-left-note"></div>
                            </div>
                            <div class="tank" id="tank-right">
                                <div class="tank-label">右压载舱</div>
                                <div class="tank-fill" id="tank-right-fill"></div>
                                <div class="tank-water" id="tank-right-water"></div>
                                <div class="tank-status" id="tank-right-status">正常</div>
                                <input type="number" id="tank-right-input" class="tank-input" placeholder="注水值 0-100" min="0" max="100">
                                <div class="tank-note" id="tank-right-note"></div>
                            </div>
                        </div>
                        <div class="cargo-bay" id="cargo-bay">
                            <div class="cargo-label">货舱载重</div>
                            <div class="cargo-bar">
                                <div class="cargo-fill" id="cargo-fill"></div>
                            </div>
                            <div class="cargo-weight">
                                <span id="cargo-current">0</span> / <span id="cargo-max">500</span> kg
                            </div>
                        </div>
                    </div>
                    <div class="artifacts" id="artifacts"></div>
                    <div class="sea-floor"></div>
                </div>
            </section>

            <aside class="control-panel">
                <div class="panel-section">
                    <h3>🎮 深度控制</h3>
                    <div class="depth-controls">
                        <button class="control-btn" id="btn-ascent">⬆️ 上浮</button>
                        <button class="control-btn" id="btn-descent">⬇️ 下潜</button>
                        <button class="control-btn" id="btn-hold">⏸️ 保持</button>
                    </div>
                    <div class="buoyancy-info">
                        <div class="info-row">
                            <span>浮力状态:</span>
                            <span id="buoyancy-status" class="status-neutral">平衡</span>
                        </div>
                        <div class="info-row">
                            <span>净浮力:</span>
                            <span id="net-buoyancy">0</span> N
                        </div>
                        <div class="info-row">
                            <span>潜艇自重:</span>
                            <span id="sub-weight">2000</span> kg
                        </div>
                        <div class="info-row">
                            <span>排水量:</span>
                            <span id="displacement">2000</span> kg
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>💧 压载舱控制</h3>
                    <div class="ballast-controls">
                        <button class="control-btn" id="btn-fill-left">注水左舱</button>
                        <button class="control-btn" id="btn-drain-left">排水左舱</button>
                        <button class="control-btn" id="btn-fill-right">注水右舱</button>
                        <button class="control-btn" id="btn-drain-right">排水右舱</button>
                        <button class="control-btn btn-apply" id="btn-apply-ballast">✅ 应用压载设置</button>
                    </div>
                    <div class="ballast-summary">
                        <div class="info-row">
                            <span>左舱水量:</span>
                            <span id="left-water-amount">0</span> kg
                        </div>
                        <div class="info-row">
                            <span>右舱水量:</span>
                            <span id="right-water-amount">0</span> kg
                        </div>
                        <div class="info-row">
                            <span>总压载水:</span>
                            <span id="total-ballast">0</span> kg
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>🎯 打捞操作</h3>
                    <div class="salvage-controls">
                        <button class="control-btn" id="btn-salvage" disabled>🔍 打捞文物</button>
                        <button class="control-btn" id="btn-release">📤 释放一件</button>
                        <button class="control-btn" id="btn-release-all">🗑️ 全部释放</button>
                    </div>
                    <div class="artifact-list" id="artifact-list">
                        <div class="empty-hint">货舱为空</div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>⚙️ 系统状态</h3>
                    <div class="system-alerts" id="system-alerts">
                        <div class="alert-info">系统运行正常</div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📊 任务控制</h3>
                    <div class="mission-controls">
                        <button class="control-btn btn-primary" id="btn-start">🚀 开始任务</button>
                        <button class="control-btn btn-danger" id="btn-end" disabled>🏁 结束任务</button>
                        <button class="control-btn" id="btn-export" disabled>📥 导出成绩</button>
                    </div>
                </div>
            </aside>
        </main>

        <div class="game-log" id="game-log">
            <div class="log-header">
                <span>📋 操作日志</span>
                <button class="log-clear" id="btn-clear-log">清空</button>
            </div>
            <div class="log-content" id="log-content"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" style="display: none;">
        <div class="modal" id="modal">
            <div class="modal-header" id="modal-header">
                <h2 id="modal-title">提示</h2>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer">
                <button class="control-btn btn-primary" id="modal-close">确定</button>
            </div>
        </div>
    </div>

    <script src="physics.js"></script>
    <script src="game.js"></script>
</body>
</html>
