<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>整数规划装箱推荐</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1220; --card:#161a30; --ink:#e8ecff; --muted:#9ba3c4;
    --good:#33d6a6; --warn:#ffb020; --bad:#ff5a7a; --line:#2a2f4a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:20px}
  h1{font-size:18px;margin:0 0 12px}
  h2{font-size:14px;margin:18px 0 8px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  select,button,textarea{background:#1e2440;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
  button{cursor:pointer}button:hover{background:#272f54}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tab{padding:6px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--muted)}
  .tab.active{background:#272f54;color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:500}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px}
  .p-good{background:rgba(51,214,166,.15);color:var(--good)}
  .p-warn{background:rgba(255,176,32,.15);color:var(--warn)}
  .p-bad{background:rgba(255,90,122,.15);color:var(--bad)}
  .mono{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#0b0e1a;padding:10px;border-radius:8px;overflow:auto;max-height:420px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px}
  .kv b{color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .stat{background:#10142a;border:1px solid var(--line);border-radius:8px;padding:10px}
  .stat .v{font-size:22px;font-weight:600}
  .stat .l{color:var(--muted);font-size:12px}
  .chart{height:220px}
  details{background:#10142a;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px}
  details+details{margin-top:8px}
  summary{cursor:pointer;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:6px}
  @media(max-width:800px){.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 整数规划装箱推荐 · 异常可追溯</h1>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="normal">正常</div>
    <div class="tab" data-tab="boundary">边界</div>
    <div class="tab" data-tab="bad">坏数据</div>
    <div class="tab" data-tab="custom">自定义</div>
  </div>

  <div class="row">
    <div class="card">
      <h2>请求 (JSON)</h2>
      <textarea id="payload" style="width:100%;height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button id="run">▶ 运行推荐</button>
        <button id="compare">📊 三例对比</button>
        <button id="download">⬇ 导出 CSV</button>
        <span id="status" style="margin-left:auto;color:var(--muted)">就绪</span>
      </div>
    </div>
    <div class="card">
      <h2>结果摘要</h2>
      <div class="grid">
        <div class="stat"><div class="v" id="s-feasible">-</div><div class="l">可行</div></div>
        <div class="stat"><div class="v" id="s-cost">-</div><div class="l">箱成本 (元)</div></div>
        <div class="stat"><div class="v" id="s-split">-</div><div class="l">拆箱惩罚</div></div>
        <div class="stat"><div class="v" id="s-boxes">-</div><div class="l">装箱数</div></div>
        <div class="stat"><div class="v" id="s-obj">-</div><div class="l">目标值</div></div>
        <div class="stat"><div class="v" id="s-issues">-</div><div class="l">异常条数</div></div>
      </div>
      <h2>约束解释</h2>
      <div id="explanations"></div>
      <h2>异常 / 溯源</h2>
      <div id="issues" class="mono" style="max-height:140px"></div>
    </div>
  </div>

  <div class="row" style="margin-top:14px">
    <div class="card">
      <h2>箱型体积利用率</h2>
      <div class="chart"><canvas id="vol-chart"></canvas></div>
      <div class="legend">
        <span>📘 已装载体积</span><span>📕 剩余空间</span><span>黄条: 拆箱成本惩罚</span>
      </div>
    </div>
    <div class="card">
      <h2>重量分布</h2>
      <div class="chart"><canvas id="wt-chart"></canvas></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>装箱明细 (点击行查看 SKU 溯源)</h2>
    <table id="tbl">
      <thead><tr><th>箱型</th><th>SKU</th><th>数量</th><th>方向</th><th>装载体积</th><th>箱内重量</th><th>提示</th></tr></thead>
      <tbody></tbody>
    </table>
    <details open>
      <summary>SKU 溯源 / 箱型来源</summary>
      <div id="trace" class="mono"></div>
    </details>
    <details>
      <summary>方案对比 (点击"📊 三例对比"后查看)</summary>
      <div id="compare-out" class="mono"></div>
    </details>
  </div>
</div>
<script>
const samples = {};
let current = null;
let volChart = null, wtChart = null;
const fmt = v => v===null||v===undefined?'-':v;
const api = async (url, body) => {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};
const loadSample = async name => {
  const r = await fetch('/api/v1/pack/samples/' + name);
  samples[name] = await r.json();
  if (name === 'normal' || name === 'boundary' || name === 'bad') {
    // cache three
  }
};
const setTab = name => {
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === name));
  const p = samples[name];
  document.getElementById('payload').value = JSON.stringify(p, null, 2);
  document.getElementById('status').textContent = '已载入样例: ' + name;
};
const render = report => {
  current = report;
  const setText = (id, v, cls) => {
    const el = document.getElementById(id);
    el.textContent = fmt(v);
    if (cls) el.style.color = cls;
  };
  setText('s-feasible', report.feasible ? '✓ 可行' : '✗ 不可行', report.feasible ? 'var(--good)' : 'var(--bad)');
  setText('s-cost', report.total_cost);
  setText('s-split', report.split_penalty_total);
  setText('s-boxes', report.boxes_opened);
  setText('s-obj', report.objective_value);
  setText('s-issues', report.issues.length, report.issues.length ? 'var(--warn)' : '');

  const exp = document.getElementById('explanations');
  exp.innerHTML = report.explanations.map(e =>
    `<details open><summary><b>${e.constraint}</b> · ${e.description}</summary><div class="kv" style="margin-top:6px"><b>是否生效</b><span>${e.active?'是':'否'}</span><b>说明</b><span>${e.detail||'-'}</span></div></details>`
  ).join('') || '<p style="color:var(--muted)">无</p>';

  document.getElementById('issues').textContent = report.issues.join('\n') || '无异常';

  const tbody = document.querySelector('#tbl tbody');
  tbody.innerHTML = '';
  const boxMap = {};
  report.assignments.forEach(a => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${a.box_id}<br><span style="color:var(--muted)">${a.box_name}</span></td>
      <td>${a.sku_id}</td><td>${a.qty}</td><td>${a.orientation}</td>
      <td>${a.packed_volume_cm3} / ${a.box_used_volume_cm3} cm³</td>
      <td>${a.weight_in_box_kg} kg</td>
      <td>${a.warnings.map(w=>`<span class="pill p-warn">${w}</span>`).join('')||'-'}</td>`;
    tr.style.cursor = 'pointer';
    tr.onclick = () => {
      const trace = report.trace?.sku_trace?.[a.sku_id] || {};
      document.getElementById('trace').textContent = JSON.stringify({sku:a.sku_id, ...trace}, null, 2);
    };
    tbody.appendChild(tr);
    boxMap[a.box_id] = boxMap[a.box_id] || {used:a.box_used_volume_cm3, total:a.box_total_volume_cm3, weight:a.weight_in_box_kg};
  });
  document.getElementById('trace').textContent = JSON.stringify(report.trace || {}, null, 2);

  const labels = Object.keys(boxMap);
  const used = labels.map(k => boxMap[k].used);
  const total = labels.map(k => boxMap[k].total - boxMap[k].used);
  const weight = labels.map(k => boxMap[k].weight);

  const mk = (id, datasets) => {
    const el = document.getElementById(id);
    if (volChart && id==='vol-chart') { volChart.destroy(); }
    if (wtChart && id==='wt-chart') { wtChart.destroy(); }
    const ctx = el.getContext('2d');
    const ch = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#e8ecff'}}},
        scales:{x:{ticks:{color:'#9ba3c4'}},y:{ticks:{color:'#9ba3c4'}}}
      }
    });
    return ch;
  };
  volChart = mk('vol-chart', [
    {label:'已装载 cm³', data:used, backgroundColor:'#4d6bff'},
    {label:'剩余空间 cm³', data:total, backgroundColor:'#2a2f4a'},
  ]);
  wtChart = mk('wt-chart', [
    {label:'箱内重量 kg', data:weight, backgroundColor:'#ffb020'},
  ]);
};
const run = async () => {
  const txt = document.getElementById('payload').value;
  let p; try { p = JSON.parse(txt); } catch(e){ alert('JSON 解析失败: ' + e.message); return; }
  document.getElementById('status').textContent = '运行中…';
  try {
    const r = await api('/api/v1/pack/recommend', p);
    render(r);
    document.getElementById('status').textContent = r.feasible ? '完成: 可行解' : '完成: 不可行/有异常';
  } catch(e) { document.getElementById('status').textContent = '失败: ' + e.message; }
};
const compareAll = async () => {
  const r = await api('/api/v1/pack/compare', [samples.normal, samples.boundary, samples.bad]);
  document.getElementById('compare-out').textContent = JSON.stringify(r, null, 2);
};
const download = async () => {
  const txt = document.getElementById('payload').value;
  let p; try { p = JSON.parse(txt); } catch(e){ alert('JSON 解析失败'); return; }
  const r = await fetch('/api/v1/pack/recommend/csv', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p)});
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = (p.order_id||'packing')+'.csv'; a.click();
  URL.revokeObjectURL(url);
};
document.querySelectorAll('.tab').forEach(el => el.onclick = () => setTab(el.dataset.tab));
document.getElementById('run').onclick = run;
document.getElementById('compare').onclick = compareAll;
document.getElementById('download').onclick = download;
(async () => {
  for (const n of ['normal','boundary','bad']) await loadSample(n);
  setTab('normal');
})();
</script>
</body>
</html>
