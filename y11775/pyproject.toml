[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cov-cleaner"
version = "0.1.0"
description = "Covariance Matrix Cleaning CLI for Quantitative Finance"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "click>=8.0",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "pyyaml>=5.4",
    "tabulate>=0.8",
]

[project.scripts]
cov-cleaner = "cov_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cov_cleaner*"]
