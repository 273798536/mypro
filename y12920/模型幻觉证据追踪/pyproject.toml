[project]
name = "hallucination-tracker"
version = "1.0.0"
description = "AI/ML工作流工具 - 模型幻觉证据追踪系统"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "scikit-learn>=1.3.0",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.21.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
]

[project.scripts]
hallucination-tracker = "app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
