[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-window-budgeter"
version = "1.0.0"
description = "上下文窗口预算器 - AI/ML工作流工具：样本去重、版本追踪、安全拦截、人工复核、导出验证"
requires-python = ">=3.9"
dependencies = [
    "tiktoken>=0.5.0",
]

[project.scripts]
cwb = "context_window_budgeter.cli:main"

[tool.setuptools.packages.find]
include = ["context_window_budgeter*"]
