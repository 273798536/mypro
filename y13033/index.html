<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应链预付款审批留痕系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>供应链预付款审批留痕</h1>
    <div class="header-info">
      <span id="currentUser" class="user-tag">当前：产品财务小周</span>
      <span id="currentDate" class="date-tag"></span>
    </div>
  </header>

  <nav class="app-nav">
    <button class="nav-btn active" data-view="summary">汇总统计</button>
    <button class="nav-btn" data-view="transactions">银行流水</button>
    <button class="nav-btn" data-view="approvals">审批记录</button>
    <button class="nav-btn" data-view="audit">变更审计</button>
    <button class="nav-btn" data-view="handover">交接测试</button>
  </nav>

  <main class="app-main">
    <section id="view-summary" class="view active"></section>
    <section id="view-transactions" class="view"></section>
    <section id="view-approvals" class="view"></section>
    <section id="view-audit" class="view"></section>
    <section id="view-handover" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content" id="modalContent"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/modules/transactions.js"></script>
<script src="js/modules/approvals.js"></script>
<script src="js/modules/summary.js"></script>
<script src="js/modules/audit.js"></script>
<script src="js/modules/handover.js"></script>
<script src="js/app.js"></script>
</body>
</html>
