[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commission-cli"
version = "0.1.0"
description = "佣金阶梯复核CLI - 销售提成计算与复核工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
commission = "commission.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
