[tool.poetry]
name = "mc-loss-sandbox"
version = "0.1.0"
description = "蒙特卡洛亏损沙盘 - 精算随机模拟CLI工具"
authors = ["精算团队"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
click = ">=8.0,<9.0"
numpy = ">=1.22,<2.0"
pandas = ">=1.4,<3.0"
scipy = ">=1.8,<2.0"
matplotlib = ">=3.5,<4.0"
seaborn = ">=0.11,<1.0"
jinja2 = ">=3.0,<4.0"
pydantic = ">=2.0,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mc-sandbox = "mc_loss_sandbox.cli:main"
