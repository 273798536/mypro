[tool.poetry]
name = "mc-loss-sandbox"
version = "0.1.0"
description = "蒙特卡洛亏损沙盘 - 精算随机模拟CLI工具"
authors = ["精算团队"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.0"
numpy = "^1.26.0"
pandas = "^2.1.0"
scipy = "^1.11.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
jinja2 = "^3.1.0"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mc-sandbox = "mc_loss_sandbox.cli:main"
