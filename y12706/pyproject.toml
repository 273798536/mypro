[project]
name = "shortest-path-inspector"
version = "0.1.0"
description = "图论最短路巡检 CLI 工具 - 用于排课巡检校验"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sp-inspector = "shortest_path_inspector.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shortest_path_inspector*"]
