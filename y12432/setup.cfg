[metadata]
name = bonded-duty-estimator
version = 1.0.0
description = 保税仓进口关税暂估工具 - 跨境供应链财务专用

[options]
package_dir =
    = src
packages = find:
install_requires =
    click>=8.1.0
    pandas>=2.0.0
    openpyxl>=3.1.0
    sqlalchemy>=2.0.0
    python-dateutil>=2.8.0
    tabulate>=0.9.0
    rich>=13.0.0

[options.entry_points]
console_scripts =
    bde = bde.cli:cli

[options.packages.find]
where = src
