[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bonded-duty-estimator"
version = "1.0.0"
description = "保税仓进口关税暂估工具 - 跨境供应链财务专用"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Cross-Border Supply Chain Finance Team" }]
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
bde = "bde.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bde = ["templates/*"]
