<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史壁画损伤描摹 · 复核看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f3ef;--card:#fff;--border:#e0dcd5;--accent:#8b6914;--accent2:#c49a2a;--danger:#c0392b;--success:#27ae60;--warn:#e67e22;--text:#2c2416;--muted:#8a7e6b;--layer-old:#f8f0e0;--layer-new:#e8f5e9;--shadow:0 2px 8px rgba(44,36,22,.08)}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.top-bar{background:linear-gradient(135deg,#3e2f1c,#5c4a2e);color:#f0e8d8;padding:16px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top-bar h1{font-size:20px;font-weight:700;letter-spacing:1px}
.top-bar .subtitle{font-size:13px;color:#c4b896;margin-left:8px}
.tabs{display:flex;gap:0;margin-left:auto}
.tab-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:#c4b896;padding:8px 20px;cursor:pointer;font-size:13px;transition:all .2s}
.tab-btn:first-child{border-radius:6px 0 0 6px}
.tab-btn:last-child{border-radius:0 6px 6px 0}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-btn:hover:not(.active){background:rgba(255,255,255,.08)}
.container{max-width:1400px;margin:0 auto;padding:24px}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--accent)}
.card-title .icon{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-card .num{font-size:32px;font-weight:800;color:var(--accent)}
.stat-card .label{font-size:12px;color:var(--muted);margin-top:4px}
.stat-card.danger .num{color:var(--danger)}
.stat-card.warn .num{color:var(--warn)}
.stat-card.success .num{color:var(--success)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f5f0;text-align:left;padding:10px 12px;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover{background:#faf8f4}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-danger{background:#fde8e8;color:var(--danger)}
.badge-warn{background:#fef3e2;color:var(--warn)}
.badge-success{background:#e8f8ef;color:var(--success)}
.badge-muted{background:#f0ece4;color:var(--muted)}
.badge-info{background:#e8f0fe;color:#2c5aa0}
.issue-tag{display:inline-block;background:#fff3cd;border:1px solid #ffc107;color:#856404;padding:1px 6px;border-radius:4px;font-size:11px;margin:1px 2px}
.missing-tag{background:#fde8e8;border-color:#e74c3c;color:#c0392b}
.supplement-tag{background:#e8f0fe;border-color:#6c8ebf;color:#2c5aa0}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#a07818}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:#f5f3ef}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-success{background:var(--success);color:#fff}
.chart-container{position:relative;height:220px}
.chart-container canvas{width:100%!important;height:100%!important}
.layer-diff{display:flex;gap:16px;margin-top:12px}
.layer-diff .side{flex:1;border-radius:8px;padding:14px;font-size:13px}
.layer-diff .old{background:var(--layer-old);border:1px solid #e0cfa0}
.layer-diff .new{background:var(--layer-new);border:1px solid #a0d8a0}
.layer-diff .side h4{font-size:13px;margin-bottom:8px;opacity:.7}
.change-mark{background:#fff3cd;border-left:3px solid var(--warn);padding:4px 10px;margin:6px 0;border-radius:0 4px 4px 0;font-size:13px}
.review-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.review-log{max-height:300px;overflow-y:auto}
.review-log .entry{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.review-log .entry .time{color:var(--muted);white-space:nowrap;font-size:12px;min-width:130px}
.review-log .entry .action-type{font-weight:600;min-width:70px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;font-size:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
.form-group textarea{min-height:60px;resize:vertical}
.toast{position:fixed;top:80px;right:24px;background:var(--text);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.export-section{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.misjudgment-trace{border-left:3px solid var(--danger);padding:10px 14px;margin:8px 0;background:#fef8f8;border-radius:0 6px 6px 0}
.misjudgment-trace .source{font-size:12px;color:var(--muted);margin-top:4px}
.data-issue-inline{cursor:help;border-bottom:1px dashed var(--danger)}
.run-indicator{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.run-indicator .dot{width:6px;height:6px;border-radius:50%}
.dot-pending{background:var(--warn)}
.dot-confirmed{background:var(--success)}
.dot-revised{background:#2c5aa0}
.progress-bar{height:6px;background:#e8e4dc;border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .4s}
</style>
</head>
<body>

<div class="top-bar">
  <h1>历史壁画损伤描摹<span class="subtitle">复核看板</span></h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard')">看板总览</button>
    <button class="tab-btn" onclick="switchTab('detail')">明细数据</button>
    <button class="tab-btn" onclick="switchTab('layer')">图层管理</button>
    <button class="tab-btn" onclick="switchTab('review')">复核流程</button>
    <button class="tab-btn" onclick="switchTab('report')">最终报告</button>
  </div>
</div>

<div class="container">

  <div id="panel-dashboard" class="panel active">
    <div class="stats-row" id="statsRow"></div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title"><span class="icon" style="background:var(--accent)">📊</span>损伤分布图</div>
        <div class="chart-container"><canvas id="damageChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title"><span class="icon" style="background:var(--danger)">⚠</span>碰撞边界误判分布</div>
        <div class="chart-container"><canvas id="misjudgmentChart"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon" style="background:var(--warn)">📋</span>设备清单概览</div>
      <table id="equipmentOverview">
        <thead>
          <tr><th>设备编号</th><th>设备名称</th><th>损伤区域</th><th>碰撞边界</th><th>数据状态</th><th>复核状态</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="panel-detail" class="panel">
    <div class="card">
      <div class="card-title"><span class="icon" style="background:var(--accent)">📑</span>完整明细（统一数据源）</div>
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <input type="text" id="searchInput" placeholder="搜索设备、区域、备注…" style="padding:7px 12px;border:1px solid var(--border);border-radius:6px;width:240px;font-size:13px" oninput="renderDetailTable()">
        <select id="filterIssue" style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px" onchange="renderDetailTable()">
          <option value="">全部数据状态</option>
          <option value="missing-unit">漏填单位</option>
          <option value="supplement">补录数据</option>
          <option value="old-format">旧表格式</option>
          <option value="bad-data">坏数据</option>
        </select>
        <div class="export-section">
          <button class="btn btn-primary btn-sm" onclick="exportCSV()">导出 CSV</button>
          <button class="btn btn-outline btn-sm" onclick="exportJSON()">导出 JSON</button>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table id="detailTable">
          <thead>
            <tr><th>ID</th><th>设备编号</th><th>设备名称</th><th>损伤区域</th><th>轨迹坐标</th><th>碰撞边界</th><th>单位</th><th>讲解备注</th><th>数据问题</th><th>判断结果</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="panel-layer" class="panel">
    <div class="card">
      <div class="card-title"><span class="icon" style="background:#2c5aa0">🗂</span>图层前后对比</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">导出复盘改变判断后，此处显示原始图层与修订图层的差异</p>
      <div id="layerComparison"></div>
    </div>
  </div>

  <div id="panel-review" class="panel">
    <div class="grid-3">
      <div class="card">
        <div class="card-title"><span class="icon" style="background:var(--warn)">🔄</span>重复运行</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px">重新执行碰撞边界检测，观察结果一致性</p>
        <button class="btn btn-primary" onclick="runRepeat()">执行重复运行</button>
        <div id="repeatResult" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <div class="card-title"><span class="icon" style="background:#2c5aa0">📝</span>补录备注</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px">为已有记录补充说明或修正遗漏</p>
        <button class="btn btn-primary" onclick="openSupplementModal()">添加补录</button>
      </div>
      <div class="card">
        <div class="card-title"><span class="icon" style="background:var(--success)">✅</span>人工确认</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px">逐条确认或驳回自动判断</p>
        <button class="btn btn-success" onclick="batchConfirm()">批量确认待审项</button>
        <div id="confirmResult" style="margin-top:12px"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon" style="background:var(--muted)">📜</span>复核操作日志</div>
      <div class="review-log" id="reviewLog"></div>
    </div>
  </div>

  <div id="panel-report" class="panel">
    <div class="card">
      <div class="card-title"><span class="icon" style="background:var(--accent)">📄</span>最终报告</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">学生可直接查看：碰撞边界误判卡在哪份材料上</p>
      <div id="reportContent"></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon" style="background:var(--danger)">🔍</span>误判追踪明细</div>
      <div id="misjudgmentTrace"></div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="supplementModal">
  <div class="modal">
    <h3>补录备注</h3>
    <div class="form-group">
      <label>选择记录</label>
      <select id="supplementRecord"></select>
    </div>
    <div class="form-group">
      <label>补录内容</label>
      <textarea id="supplementText" placeholder="输入补充说明…"></textarea>
    </div>
    <div class="form-group">
      <label>修订碰撞边界判断（可选）</label>
      <select id="supplementJudgment">
        <option value="">不改</option>
        <option value="正常">正常</option>
        <option value="疑似误判">疑似误判</option>
        <option value="确认误判">确认误判</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeSupplementModal()">取消</button>
      <button class="btn btn-primary" onclick="submitSupplement()">提交补录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var DATA = (function(){
  var raw = [
    {id:"MRL-001",equipId:"EQ-0137",equipName:"3D结构光扫描仪",area:"A区-佛像头部",boundary:"正常",unit:"mm",notes:"表层颜料剥落约30%",issues:[],trajectory:[{x:120,y:45,t:"09:12:03"},{x:118,y:48,t:"09:12:15"},{x:122,y:50,t:"09:12:27"}]},
    {id:"MRL-002",equipId:"EQ-0137",equipName:"3D结构光扫描仪",area:"A区-佛像左肩",boundary:"疑似误判",unit:"mm",notes:"裂缝延伸至基岩层，补录：旧表记录为0.3cm需统一单位",issues:["old-format","supplement"],trajectory:[{x:200,y:80,t:"09:15:01"},{x:205,y:83,t:"09:15:14"},{x:203,y:87,t:"09:15:28"}]},
    {id:"MRL-003",equipId:"EQ-0258",equipName:"红外热成像仪",area:"B区-经文壁画",boundary:"正常",unit:"",notes:"热异常区域0.5—漏填单位，推测为℃",issues:["missing-unit"],trajectory:[{x:310,y:150,t:"10:03:22"},{x:315,y:152,t:"10:03:35"}]},
    {id:"MRL-004",equipId:"EQ-0258",equipName:"红外热成像仪",area:"B区-飞天人物",boundary:"确认误判",unit:"℃",notes:"原判断为正常，复盘后确认碰撞边界误判",issues:[],trajectory:[{x:320,y:160,t:"10:08:10"},{x:325,y:163,t:"10:08:22"},{x:318,y:168,t:"10:08:35"}]},
    {id:"MRL-005",equipId:"EQ-0412",equipName:"多光谱相机",area:"C区-供养人像",boundary:"正常",unit:"μm",notes:"底层草稿线显现",issues:[],trajectory:[{x:80,y:290,t:"11:20:05"},{x:82,y:295,t:"11:20:18"}]},
    {id:"MRL-006",equipId:"EQ-0412",equipName:"多光谱相机",area:"C区-边饰纹样",boundary:"疑似误判",unit:"",notes:"补录：此区域旧表编号C-07与现编号C-12不一致，漏填单位应为μm",issues:["missing-unit","supplement","old-format"],trajectory:[{x:90,y:300,t:"11:25:11"},{x:92,y:303,t:"11:25:24"},{x:88,y:307,t:"11:25:38"}]},
    {id:"MRL-007",equipId:"EQ-0089",equipName:"激光测距仪",area:"D区-藻井",boundary:"正常",unit:"mm",notes:"拱顶形变测量",issues:[],trajectory:[{x:400,y:30,t:"13:40:00"},{x:402,y:35,t:"13:40:12"}]},
    {id:"MRL-008",equipId:"EQ-0089",equipName:"激光测距仪",area:"D区-藻井边沿",boundary:"确认误判",unit:"mm",notes:"旧表记为'2'无单位无小数点，实际为2.3mm",issues:["old-format","bad-data"],trajectory:[{x:410,y:38,t:"13:45:20"},{x:412,y:40,t:"13:45:33"},{x:408,y:44,t:"13:45:46"}]},
    {id:"MRL-009",equipId:"EQ-0137",equipName:"3D结构光扫描仪",area:"A区-背光区域",boundary:"正常",unit:"mm",notes:"金箔层氧化变色",issues:[],trajectory:[{x:135,y:55,t:"09:20:00"},{x:137,y:58,t:"09:20:12"}]},
    {id:"MRL-010",equipId:"EQ-0258",equipName:"红外热成像仪",area:"B区-力士像",boundary:"疑似误判",unit:"℃",notes:"补录：旧表温度值缺少小数位，32→32.4℃",issues:["supplement","old-format"],trajectory:[{x:340,y:175,t:"10:12:00"},{x:342,y:178,t:"10:12:15"},{x:338,y:180,t:"10:12:30"}]},
    {id:"MRL-011",equipId:"EQ-0412",equipName:"多光谱相机",area:"C区-题记",boundary:"确认误判",unit:"μm",notes:"补录备注：此区域旧表记为'无异常'但多光谱数据明显异常，原判断遗漏",issues:["supplement","bad-data"],trajectory:[{x:100,y:310,t:"11:30:00"},{x:102,y:312,t:"11:30:12"},{x:98,y:315,t:"11:30:25"}]},
    {id:"MRL-012",equipId:"EQ-0089",equipName:"激光测距仪",area:"D区-角柱",boundary:"正常",unit:"",notes:"测量值5，漏填单位应为mm",issues:["missing-unit"],trajectory:[{x:420,y:50,t:"13:50:00"},{x:422,y:53,t:"13:50:12"}]}
  ];

  var state = raw.map(function(r){
    return {
      id:r.id,
      equipId:r.equipId,
      equipName:r.equipName,
      area:r.area,
      boundary:r.boundary,
      unit:r.unit,
      notes:r.notes,
      issues:r.issues,
      trajectory:r.trajectory,
      originalBoundary:r.boundary,
      revisedBoundary:null,
      boundaryChanged:false,
      supplementaryNotes:[],
      confirmed:r.boundary==="正常"?"confirmed":"pending",
      runCount:1,
      confirmHistory:[]
    };
  });

  return state;
})();

var REVIEW_LOG = [];

function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  setTimeout(function(){el.classList.remove("show")},2200);
}

function switchTab(name){
  document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active")});
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active")});
  event.target.classList.add("active");
  document.getElementById("panel-"+name).classList.add("active");
  if(name==="dashboard")renderDashboard();
  if(name==="detail")renderDetailTable();
  if(name==="layer")renderLayerComparison();
  if(name==="review")renderReviewPanel();
  if(name==="report")renderReport();
}

function computeStats(){
  var total=DATA.length;
  var misjudged=DATA.filter(function(d){return d.boundary==="确认误判"||d.boundary==="疑似误判"}).length;
  var confirmed=DATA.filter(function(d){return d.confirmed==="confirmed"}).length;
  var issues=DATA.filter(function(d){return d.issues.length>0}).length;
  var badData=DATA.filter(function(d){return d.issues.indexOf("bad-data")>=0}).length;
  var missingUnit=DATA.filter(function(d){return d.issues.indexOf("missing-unit")>=0}).length;
  var supplement=DATA.filter(function(d){return d.issues.indexOf("supplement")>=0}).length;
  var oldFormat=DATA.filter(function(d){return d.issues.indexOf("old-format")>=0}).length;
  return {total:total,misjudged:misjudged,confirmed:confirmed,issues:issues,badData:badData,missingUnit:missingUnit,supplement:supplement,oldFormat:oldFormat};
}

function renderDashboard(){
  var s=computeStats();
  document.getElementById("statsRow").innerHTML=
    '<div class="stat-card"><div class="num">'+s.total+'</div><div class="label">总记录数</div></div>'+
    '<div class="stat-card danger"><div class="num">'+s.misjudged+'</div><div class="label">误判/疑似</div></div>'+
    '<div class="stat-card warn"><div class="num">'+s.issues+'</div><div class="label">数据问题</div></div>'+
    '<div class="stat-card success"><div class="num">'+s.confirmed+'</div><div class="label">已确认</div></div>'+
    '<div class="stat-card"><div class="num">'+s.badData+'</div><div class="label">坏数据</div></div>'+
    '<div class="stat-card"><div class="num">'+s.missingUnit+'</div><div class="label">漏填单位</div></div>';

  var tbody=document.querySelector("#equipmentOverview tbody");
  tbody.innerHTML="";
  var equipMap={};
  DATA.forEach(function(d){
    if(!equipMap[d.equipId])equipMap[d.equipId]={equipId:d.equipId,equipName:d.equipName,areas:[],issues:0,pending:0};
    equipMap[d.equipId].areas.push(d.area);
    if(d.issues.length>0)equipMap[d.equipId].issues++;
    if(d.confirmed==="pending")equipMap[d.equipId].pending++;
  });
  Object.keys(equipMap).forEach(function(k){
    var e=equipMap[k];
    var statusBadge=e.issues>0?'<span class="badge badge-warn">有数据问题</span>':'<span class="badge badge-success">正常</span>';
    var reviewBadge=e.pending>0?'<span class="badge badge-danger">待确认 '+e.pending+'</span>':'<span class="badge badge-success">已确认</span>';
    tbody.innerHTML+='<tr><td>'+e.equipId+'</td><td>'+e.equipName+'</td><td>'+e.areas.join("、")+'</td><td>'+e.areas.length+' 处</td><td>'+statusBadge+'</td><td>'+reviewBadge+'</td></tr>';
  });

  renderCharts();
}

function renderCharts(){
  renderDamageChart();
  renderMisjudgmentChart();
}

function renderDamageChart(){
  var canvas=document.getElementById("damageChart");
  var ctx=canvas.getContext("2d");
  var w=canvas.parentElement.clientWidth;
  var h=220;
  canvas.width=w*2;canvas.height=h*2;
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.scale(2,2);
  ctx.clearRect(0,0,w,h);

  var areas=["A区","B区","C区","D区"];
  var counts=areas.map(function(a){return DATA.filter(function(d){return d.area.indexOf(a)>=0}).length});
  var maxVal=Math.max.apply(null,counts)+1;
  var barW=60,gap=(w-areas.length*barW)/(areas.length+1);
  var colors=["#8b6914","#c49a2a","#a07818","#d4a830"];

  areas.forEach(function(a,i){
    var x=gap+i*(barW+gap);
    var barH=(counts[i]/maxVal)*(h-50);
    ctx.fillStyle=colors[i];
    ctx.beginPath();
    ctx.roundRect(x,h-30-barH,barW,barH,4);
    ctx.fill();
    ctx.fillStyle="#2c2416";
    ctx.font="12px sans-serif";
    ctx.textAlign="center";
    ctx.fillText(a,x+barW/2,h-12);
    ctx.font="bold 14px sans-serif";
    ctx.fillText(counts[i],x+barW/2,h-35-barH);
  });
}

function renderMisjudgmentChart(){
  var canvas=document.getElementById("misjudgmentChart");
  var ctx=canvas.getContext("2d");
  var w=canvas.parentElement.clientWidth;
  var h=220;
  canvas.width=w*2;canvas.height=h*2;
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.scale(2,2);
  ctx.clearRect(0,0,w,h);

  var cats=["正常","疑似误判","确认误判"];
  var counts=cats.map(function(c){return DATA.filter(function(d){return d.boundary===c}).length});
  var total=counts.reduce(function(a,b){return a+b},0);
  var cx=w/2,cy=h/2,r=70;
  var startAngle=-Math.PI/2;
  var colors=["#27ae60","#e67e22","#c0392b"];

  counts.forEach(function(count,i){
    var sliceAngle=(count/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,startAngle,startAngle+sliceAngle);
    ctx.closePath();
    ctx.fillStyle=colors[i];
    ctx.fill();
    var midAngle=startAngle+sliceAngle/2;
    var lx=cx+Math.cos(midAngle)*(r+20);
    var ly=cy+Math.sin(midAngle)*(r+20);
    ctx.fillStyle="#2c2416";
    ctx.font="12px sans-serif";
    ctx.textAlign="center";
    ctx.fillText(cats[i]+"("+count+")",lx,ly);
    startAngle+=sliceAngle;
  });
}

function renderDetailTable(){
  var search=(document.getElementById("searchInput").value||"").toLowerCase();
  var filter=document.getElementById("filterIssue").value;
  var filtered=DATA.filter(function(d){
    if(search&&d.equipId.toLowerCase().indexOf(search)<0&&d.equipName.toLowerCase().indexOf(search)<0&&d.area.toLowerCase().indexOf(search)<0&&d.notes.toLowerCase().indexOf(search)<0)return false;
    if(filter&&d.issues.indexOf(filter)<0)return false;
    return true;
  });

  var tbody=document.querySelector("#detailTable tbody");
  tbody.innerHTML="";
  filtered.forEach(function(d){
    var issueTags=d.issues.map(function(iss){
      var label={"missing-unit":"漏填单位","supplement":"补录数据","old-format":"旧表格式","bad-data":"坏数据"}[iss]||iss;
      var cls=iss==="bad-data"||iss==="missing-unit"?"missing-tag":iss==="supplement"?"supplement-tag":"issue-tag";
      return '<span class="issue-tag '+cls+'">'+label+'</span>';
    }).join(" ");

    var unitDisplay=d.unit?d.unit:'<span class="data-issue-inline" title="单位缺失">⚠ 缺失</span>';
    var boundaryDisplay=d.boundary;
    if(d.boundaryChanged){
      boundaryDisplay='<span style="text-decoration:line-through;color:var(--muted)">'+d.originalBoundary+'</span> → <span style="color:var(--danger);font-weight:600">'+d.boundary+'</span>';
    }
    var confirmedDisplay=d.confirmed==="confirmed"?'<span class="badge badge-success">已确认</span>':'<span class="badge badge-warn">待确认</span>';

    var trajStr=d.trajectory.map(function(t){return "("+t.x+","+t.y+")"}).join(" → ");

    tbody.innerHTML+='<tr><td>'+d.id+'</td><td>'+d.equipId+'</td><td>'+d.equipName+'</td><td>'+d.area+'</td><td style="font-size:11px;font-family:monospace">'+trajStr+'</td><td>'+boundaryDisplay+'</td><td>'+unitDisplay+'</td><td style="max-width:180px;font-size:12px">'+d.notes+'</td><td>'+issueTags+'</td><td>'+confirmedDisplay+'</td></tr>';
  });
}

function renderLayerComparison(){
  var container=document.getElementById("layerComparison");
  var changed=DATA.filter(function(d){return d.boundaryChanged});
  var unchanged=DATA.filter(function(d){return !d.boundaryChanged});

  if(changed.length===0){
    container.innerHTML='<p style="color:var(--muted);font-size:13px">暂无判断变更记录。执行导出复盘或补录修订后，变更将显示在此处。</p>';
    container.innerHTML+='<p style="color:var(--muted);font-size:13px;margin-top:8px">当前所有 '+unchanged.length+' 条记录判断未变。</p>';
    return;
  }

  var html='<h4 style="margin-bottom:12px;font-size:14px;color:var(--danger)">已变更判断 ('+changed.length+' 条)</h4>';
  changed.forEach(function(d){
    var supNotes=d.supplementaryNotes.length>0?d.supplementaryNotes.map(function(s){return '<div class="change-mark">补录：'+s+'</div>';}).join("") :"";
    html+='<div class="layer-diff">'+
      '<div class="side old"><h4>原始图层</h4>'+
        '<div>碰撞边界：<strong>'+d.originalBoundary+'</strong></div>'+
        '<div>设备：'+d.equipId+' '+d.equipName+'</div>'+
        '<div>区域：'+d.area+'</div>'+
        '<div>原始备注：'+d.notes+'</div>'+
      '</div>'+
      '<div class="side new"><h4>修订图层</h4>'+
        '<div>碰撞边界：<strong style="color:var(--danger)">'+d.boundary+'</strong></div>'+
        '<div>设备：'+d.equipId+' '+d.equipName+'</div>'+
        '<div>区域：'+d.area+'</div>'+
        supNotes+
      '</div>'+
    '</div>';
  });
  container.innerHTML=html;
}

function renderReviewPanel(){
  renderReviewLog();
}

function renderReviewLog(){
  var container=document.getElementById("reviewLog");
  if(REVIEW_LOG.length===0){
    container.innerHTML='<div style="color:var(--muted);font-size:13px;padding:12px">暂无操作记录</div>';
    return;
  }
  container.innerHTML=REVIEW_LOG.map(function(entry){
    var typeClass={"重复运行":"badge-info","补录备注":"badge-warn","人工确认":"badge-success"}[entry.type]||"badge-muted";
    return '<div class="entry"><span class="time">'+entry.time+'</span><span class="action-type badge '+typeClass+'">'+entry.type+'</span><span>'+entry.detail+'</span></div>';
  }).join("");
}

function addLog(type,detail){
  REVIEW_LOG.unshift({time:new Date().toLocaleString("zh-CN"),type:type,detail:detail});
  renderReviewLog();
}

function runRepeat(){
  var result=document.getElementById("repeatResult");
  var misjudged=DATA.filter(function(d){return d.boundary==="确认误判"||d.boundary==="疑似误判"});
  var stable=0,shifted=0;
  misjudged.forEach(function(d){
    d.runCount++;
    if(Math.random()>0.15){
      stable++;
    }else{
      shifted++;
    }
  });
  result.innerHTML='<div style="font-size:13px;margin-top:8px">'+
    '<div>重复运行完成，共检测 '+misjudged.length+' 条误判/疑似记录：</div>'+
    '<div style="margin-top:6px"><span class="badge badge-success">结果一致：'+stable+'</span> <span class="badge badge-warn">结果偏移：'+shifted+'</span></div>'+
    '<div style="margin-top:4px;color:var(--muted)">偏移项需人工确认是否为边界条件波动</div>'+
  '</div>';
  addLog("重复运行","检测 "+misjudged.length+" 条误判/疑似记录，"+stable+" 条一致，"+shifted+" 条偏移");
  toast("重复运行完成");
}

function openSupplementModal(){
  var sel=document.getElementById("supplementRecord");
  sel.innerHTML=DATA.map(function(d){return '<option value="'+d.id+'">'+d.id+" - "+d.area+" ("+d.equipName+")</option>"}).join("");
  document.getElementById("supplementText").value="";
  document.getElementById("supplementJudgment").value="";
  document.getElementById("supplementModal").classList.add("show");
}

function closeSupplementModal(){
  document.getElementById("supplementModal").classList.remove("show");
}

function submitSupplement(){
  var rid=document.getElementById("supplementRecord").value;
  var text=document.getElementById("supplementText").value.trim();
  var newJudgment=document.getElementById("supplementJudgment").value;
  if(!text){toast("请输入补录内容");return;}
  var rec=DATA.find(function(d){return d.id===rid});
  if(!rec){toast("记录不存在");return;}
  rec.supplementaryNotes.push(text);
  if(rec.issues.indexOf("supplement")<0)rec.issues.push("supplement");
  if(newJudgment&&newJudgment!==rec.boundary){
    rec.originalBoundary=rec.boundary;
    rec.boundary=newJudgment;
    rec.boundaryChanged=true;
    rec.confirmed="pending";
  }
  closeSupplementModal();
  addLog("补录备注",rid+"："+text+(newJudgment?" → 判断修订为「"+newJudgment+"」":""));
  toast("补录已提交");
  renderLayerComparison();
}

function batchConfirm(){
  var pending=DATA.filter(function(d){return d.confirmed==="pending"});
  if(pending.length===0){toast("没有待确认项");return;}
  var count=0;
  pending.forEach(function(d){
    if(d.boundary==="正常"||(d.boundary==="疑似误判"&&d.runCount>=2)){
      d.confirmed="confirmed";
      d.confirmHistory.push({time:new Date().toLocaleString("zh-CN"),action:"批量确认",from:d.originalBoundary,to:d.boundary});
      count++;
    }
  });
  document.getElementById("confirmResult").innerHTML='<div style="font-size:13px"><span class="badge badge-success">已确认 '+count+'</span> <span class="badge badge-warn">仍待审 '+(pending.length-count)+'</span></div>';
  addLog("人工确认","批量确认 "+count+" 条，仍待审 "+(pending.length-count)+" 条（需逐条处理）");
  toast("已确认 "+count+" 条记录");
}

function renderReport(){
  var misjudged=DATA.filter(function(d){return d.boundary==="确认误判"||d.boundary==="疑似误判"});

  var reportHtml='<div style="border:2px solid var(--accent);border-radius:10px;padding:20px;background:#faf8f4">'+
    '<h3 style="margin-bottom:12px;color:var(--accent)">历史壁画损伤描摹 · 复核报告</h3>'+
    '<div style="font-size:13px;margin-bottom:8px">生成时间：'+new Date().toLocaleString("zh-CN")+'</div>'+
    '<div style="font-size:13px;margin-bottom:8px">总记录：'+DATA.length+' 条 | 误判/疑似：'+misjudged.length+' 条 | 已确认：'+DATA.filter(function(d){return d.confirmed==="confirmed"}).length+' 条</div>'+
    '<div class="progress-bar" style="margin:10px 0"><div class="fill" style="width:'+Math.round(DATA.filter(function(d){return d.confirmed==="confirmed"}).length/DATA.length*100)+'%;background:var(--success)"></div></div>'+
    '<div style="font-size:12px;color:var(--muted)">确认进度 '+Math.round(DATA.filter(function(d){return d.confirmed==="confirmed"}).length/DATA.length*100)+'%</div>'+
  '</div>';

  document.getElementById("reportContent").innerHTML=reportHtml;

  var traceHtml="";
  misjudged.forEach(function(d){
    var sourceDesc="";
    if(d.issues.indexOf("bad-data")>=0){
      sourceDesc+="坏数据：";
      if(d.id==="MRL-008")sourceDesc+="旧表仅记为'2'，无单位无小数点，实际值2.3mm";
      if(d.id==="MRL-011")sourceDesc+="旧表记为'无异常'，但多光谱数据明显异常";
    }
    if(d.issues.indexOf("missing-unit")>=0){
      sourceDesc+=(sourceDesc?"；":"")+"漏填单位";
    }
    if(d.issues.indexOf("old-format")>=0){
      sourceDesc+=(sourceDesc?"；":"")+"旧表格式与现编号不一致";
    }
    if(!sourceDesc)sourceDesc="自动检测碰撞边界偏差";

    traceHtml+='<div class="misjudgment-trace">'+
      '<div><strong>'+d.id+'</strong> '+d.area+' <span class="badge '+(d.boundary==="确认误判"?"badge-danger":"badge-warn")+'">'+d.boundary+'</span></div>'+
      '<div>设备：'+d.equipId+' '+d.equipName+'</div>'+
      '<div>判断变更：'+(d.boundaryChanged?'<span style="text-decoration:line-through">'+d.originalBoundary+'</span> → <strong style="color:var(--danger)">'+d.boundary+'</strong>':'无变更')+'</div>'+
      '<div>复核状态：'+(d.confirmed==="confirmed"?'<span class="badge badge-success">已确认</span>':'<span class="badge badge-warn">待确认</span>')+'</div>'+
      '<div class="source">误判来源材料：'+sourceDesc+'</div>'+
      (d.supplementaryNotes.length>0?'<div style="margin-top:4px">补录：'+d.supplementaryNotes.join("；")+'</div>':"")+
    '</div>';
  });

  document.getElementById("misjudgmentTrace").innerHTML=traceHtml||'<p style="color:var(--muted);font-size:13px">无碰撞边界误判记录</p>';
}

function exportCSV(){
  var header="ID,设备编号,设备名称,损伤区域,碰撞边界,原始判断,是否变更,单位,讲解备注,数据问题,确认状态,运行次数\n";
  var rows=DATA.map(function(d){
    return [d.id,d.equipId,d.equipName,d.area,d.boundary,d.originalBoundary,d.boundaryChanged?"是":"否",d.unit||"(缺失)",'"'+d.notes.replace(/"/g,'""')+'"',d.issues.join(";")||"无",d.confirmed,d.runCount].join(",");
  }).join("\n");
  downloadFile(header+rows,"历史壁画损伤描摹_导出.csv","text/csv;charset=utf-8");
  addLog("导出","导出 CSV，共 "+DATA.length+" 条记录");
  toast("CSV 已导出");
}

function exportJSON(){
  var jsonStr=JSON.stringify(DATA,null,2);
  downloadFile(jsonStr,"历史壁画损伤描摹_导出.json","application/json;charset=utf-8");
  addLog("导出","导出 JSON，共 "+DATA.length+" 条记录");
  toast("JSON 已导出");
}

function downloadFile(content,filename,mime){
  var BOM="\uFEFF";
  var blob=new Blob([BOM+content],{type:mime});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
