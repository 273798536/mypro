{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>⚙️ 优化计算</h2>
    <p style="margin-bottom: 1.5rem;">点击按钮运行线性规划算法，生成最优仓储分拨方案。</p>
    
    <form method="POST">
        <button type="submit" class="btn btn-primary" style="font-size: 1rem; padding: 0.8rem 2rem;">
            🚀 开始优化计算
        </button>
    </form>
</div>

<div class="card">
    <h2>💡 算法说明</h2>
    <div style="line-height: 1.8;">
        <p><strong>优化目标：</strong>最小化总运输成本</p>
        <p><strong>约束条件：</strong></p>
        <ul style="margin-left: 1.5rem; margin-top: 0.5rem;">
            <li>仓库出库量不超过库存</li>
            <li>门店收货量满足90%以上需求</li>
            <li>优先满足高优先级门店和紧急需求</li>
        </ul>
        <p style="margin-top: 1rem;"><strong>冲突检测：</strong></p>
        <ul style="margin-left: 1.5rem; margin-top: 0.5rem;">
            <li>🔴 容量超限 - 仓库库存超过最大容量</li>
            <li>🟠 库存不足 - 总需求超过总库存</li>
            <li>🟡 时限约束 - 存在紧急需求需关注</li>
            <li>⚪ 零需求/零库存 - 数据异常提示</li>
        </ul>
    </div>
</div>
{% endblock %}
