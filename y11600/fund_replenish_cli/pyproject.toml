[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-replenish-cli"
version = "1.0.0"
description = "基金定投断点补扣 CLI 工具 - 处理银行回盘、客户补扣名单、节假日顺延、幂等补扣、对账导出"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "rich>=13.0",
]

[project.scripts]
fund-replenish = "fund_replenish_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
