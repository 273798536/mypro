[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-insurance-calculator"
version = "1.0.0"
description = "农险灾损赔付测算命令行工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "shapely>=2.0.0",
]

[project.scripts]
agri-ins = "agri_insurance_calculator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
