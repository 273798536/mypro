<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矿石品位滴定核对系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-inner">
            <h1>矿石品位滴定核对系统</h1>
            <div class="header-actions">
                <button id="btnExport" class="btn btn-secondary" onclick="exportReport()">导出核对报告</button>
                <button id="btnBack" class="btn btn-ghost hidden" onclick="goBack()">← 返回列表</button>
            </div>
        </div>
    </header>

    <main id="app">
        <section id="listView" class="view">
            <div class="view-header">
                <div class="filter-bar">
                    <div class="filter-group">
                        <label>状态筛选：</label>
                        <button class="chip chip-active" data-filter="all">全部</button>
                        <button class="chip chip-green" data-filter="pass">✓ 可直接用</button>
                        <button class="chip chip-yellow" data-filter="review">⚠ 待复核</button>
                        <button class="chip chip-red" data-filter="reject">✗ 异常/坏数据</button>
                    </div>
                    <div class="filter-group">
                        <label>搜索：</label>
                        <input type="text" id="searchInput" placeholder="输入批号、矿石编号、学生姓名..." oninput="renderList()">
                    </div>
                </div>
                <div class="stats-bar" id="statsBar"></div>
            </div>

            <div class="table-wrapper">
                <table class="data-table" id="recordsTable">
                    <thead>
                        <tr>
                            <th>原始行号</th>
                            <th>批号</th>
                            <th>矿石编号</th>
                            <th>实验日期</th>
                            <th>学生</th>
                            <th>实测品位(%)</th>
                            <th>理论品位(%)</th>
                            <th>偏差</th>
                            <th>试剂台账</th>
                            <th>状态</th>
                            <th>来源备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody"></tbody>
                </table>
            </div>

            <div class="legend-section">
                <h3>状态说明</h3>
                <div class="legend-items">
                    <div class="legend-item">
                        <span class="badge badge-green">✓ 可直接用</span>
                        <span>偏差在允许范围内，滴定曲线平滑，试剂台账匹配</span>
                    </div>
                    <div class="legend-item">
                        <span class="badge badge-yellow">⚠ 待复核</span>
                        <span>偏差略大、曲线有波动或试剂批号存疑，需化学老师确认</span>
                    </div>
                    <div class="legend-item">
                        <span class="badge badge-red">✗ 异常/坏数据</span>
                        <span>严重超差、数据缺失、曲线明显异常或台账冲突，不可用</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="detailView" class="view hidden">
            <div class="detail-header" id="detailHeader"></div>

            <div class="detail-content">
                <div class="panel panel-left">
                    <div class="panel-title">滴定谱图</div>
                    <div class="chart-container">
                        <canvas id="titrationChart"></canvas>
                    </div>
                    <div class="chart-annotations" id="chartAnnotations"></div>
                </div>

                <div class="panel panel-right">
                    <div class="panel-title">核对结果总览</div>
                    <div class="summary-cards" id="summaryCards"></div>

                    <div class="panel-title">原始滴定数据</div>
                    <div class="data-block" id="titrationDataBlock"></div>

                    <div class="panel-title">试剂台账核对</div>
                    <div class="reagent-check" id="reagentCheck"></div>

                    <div class="panel-title">异常留痕</div>
                    <div class="anomaly-trace" id="anomalyTrace"></div>
                </div>
            </div>

            <div class="bottom-panel">
                <div class="panel-title">文字说明与来源追溯</div>
                <div class="narrative-block" id="narrativeBlock"></div>
            </div>
        </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
