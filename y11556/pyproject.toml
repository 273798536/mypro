[tool.poetry]
name = "agri-delivery-inspector"
version = "0.1.0"
description = "农资门店配送多源导入巡检工具"
authors = ["巡检工具开发组"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.0"
pandas = "^2.0.0"
sqlalchemy = "^2.0.0"
openpyxl = "^3.1.0"
python-dateutil = "^2.8.0"
rich = "^13.0.0"
tabulate = "^0.9.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
agri-inspect = "agri_delivery_inspector.cli:main"
