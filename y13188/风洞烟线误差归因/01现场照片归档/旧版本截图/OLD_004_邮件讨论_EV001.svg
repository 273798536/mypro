<rect x="20" y="20" width="760" height="510" fill="#f0f0f0" stroke="#999"/><rect x="20" y="20" width="760" height="60" fill="#fff" stroke="#ccc"/><text x="40" y="45" style="font-size:14px; font-weight:bold; fill:#333;">Re: 关于风洞烟线y=60mm处异常点的疑问</text><text x="40" y="68" style="font-size:11px; fill:#666;">发件人: 小王 &lt;xiaowang@lab.edu.cn&gt;   时间: 2026-06-14 15:30</text><text x="40" y="85" style="font-size:11px; fill:#666;">收件人: 小林老师 &lt;xiaolin@lab.edu.cn&gt;</text><rect x="20" y="80" width="760" height="450" fill="#fff" stroke="#ddd"/><text x="50" y="115" style="font-size:12px; fill:#333; font-family:sans-serif;">小林老师好：</text><text x="50" y="135" style="font-size:12px; fill:#333; font-family:sans-serif;"></text><text x="50" y="155" style="font-size:12px; fill:#333; font-family:sans-serif;">今天跑的烟线实验里，y=60mm那个位置（第5号测点）的横向位移有12.3mm，</text><text x="50" y="175" style="font-size:12px; fill:#333; font-family:sans-serif;">比上下两个测点大出4倍。我怀疑是边界层猝发现象，但也可能是对焦问题。</text><text x="50" y="195" style="font-size:12px; fill:#333; font-family:sans-serif;"></text><text x="50" y="215" style="font-size:12px; fill:#333; font-family:sans-serif;">我把原始照片和初步分析放在附件里了，照片编号IMG_20260614_008。</text><text x="50" y="235" style="font-size:12px; fill:#333; font-family:sans-serif;">您帮忙看一眼是真实物理现象还是数据质量问题？</text><text x="50" y="255" style="font-size:12px; fill:#333; font-family:sans-serif;"></text><text x="50" y="275" style="font-size:12px; fill:#333; font-family:sans-serif;">如果是真实的，那总误差估计要上调；如果是拍摄问题，这张照片剔除不用。</text><text x="50" y="295" style="font-size:12px; fill:#333; font-family:sans-serif;"></text><text x="50" y="315" style="font-size:12px; fill:#333; font-family:sans-serif;">附件：IMG_008_原始.jpg / IMG_008_标注.jpg / 误差分析_v0.2.xlsx</text><text x="50" y="335" style="font-size:12px; fill:#333; font-family:sans-serif;"></text><text x="50" y="355" style="font-size:12px; fill:#333; font-family:sans-serif;">  小王</text><text x="50" y="375" style="font-size:12px; fill:#333; font-family:sans-serif;">  2026.06.14</text><text x="50" y="395" style="font-size:12px; fill:#333; font-family:sans-serif;">_____________________________________________</text><text x="50" y="415" style="font-size:12px; fill:#333; font-family:sans-serif;">【原始邮件】</text><text x="50" y="435" style="font-size:11px; fill:#666; font-family:sans-serif;">> 从: 小林老师</text><text x="50" y="455" style="font-size:11px; fill:#666; font-family:sans-serif;">> 看一下第008号照片的对焦，我圈出来那块好像有点虚。</text><text x="50" y="475" style="font-size:11px; fill:#666; font-family:sans-serif;">> 另外查一下风洞运行日志，那个时间点风速稳不稳。</text><text x="50" y="495" style="font-size:11px; fill:#666; font-family:sans-serif;">> —小林</text></svg>
