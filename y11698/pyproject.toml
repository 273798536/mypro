[project]
name = "bayesian-ab-retrospective"
version = "0.1.0"
description = "Bayesian A/B test retrospective API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bayesian_ab*"]