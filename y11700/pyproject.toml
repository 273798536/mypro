[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eqtool"
version = "0.1.0"
description = "考试等值换算工具 - 多试卷原始分等值分批量换算"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "openpyxl>=3.0",
]

[project.scripts]
eqtool = "eqtool.cli:main"

[tool.setuptools.packages.find]
include = ["eqtool*"]