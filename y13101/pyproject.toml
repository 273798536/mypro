[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segment-check"
version = "1.0.0"
description = "分段回归边界校验工具 - 数据分析质量保障系统"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "tabulate>=0.8.9",
]

[project.scripts]
segment-check = "segment_check.cli:main"

[tool.setuptools.packages.find]
include = ["segment_check*"]
