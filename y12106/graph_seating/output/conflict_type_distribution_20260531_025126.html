
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>冲突类型分布 - 20260531_025126</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chart-container { width: 600px; margin: 0 auto; }
        .stats { text-align: center; margin: 20px 0; font-size: 18px; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">冲突类型分布</h1>
    <div class="stats">
        总冲突数: <strong>48</strong> |
        涉及学生: <strong>65</strong> |
        平均度数: <strong>1.48</strong>
    </div>
    <div class="chart-container">
        <canvas id="conflictTypeChart"></canvas>
    </div>
    <script>
        new Chart(document.getElementById('conflictTypeChart'), {
            type: 'pie',
            data: {
                labels: ["explicit", "leave_overlap"],
                datasets: [{
                    data: [17, 31],
                    backgroundColor: ["#FF6B6B", "#4ECDC4"]
                }]
            },
            options: {
                plugins: {
                    legend: { position: 'right' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                var value = context.raw;
                                var total = 48;
                                var percentage = ((value / total) * 100).toFixed(1);
                                return context.label + ': ' + value + ' (' + percentage + '%)';
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
